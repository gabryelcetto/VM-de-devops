# O que o Prometheus coleta (a cada 15 s)
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus          # o próprio Prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: esta-vm             # CPU, memória, disco e rede (node-exporter)
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: docker              # containers rodando/parados (métricas do Docker)
    static_configs:
      - targets: ["127.0.0.1:9323"]
