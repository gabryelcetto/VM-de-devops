# Monitoramento do DevOps-Lab: Grafana (gráficos), Prometheus (coleta de métricas),
# node-exporter (métricas desta VM) e Uptime Kuma (vigia se os serviços estão no ar).
# Liga e desliga pelo Painel DevOps (aba Monitoramento) ou aqui:
#   docker compose -f /opt/devops-lab/monitoramento/docker-compose.yml up -d
#   docker compose -f /opt/devops-lab/monitoramento/docker-compose.yml down
# Tudo em network_mode: host e ouvindo só em 127.0.0.1 (só abre dentro da VM).
name: monitoramento

services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=300MB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dados:/prometheus
    mem_limit: 256m
    restart: "no"

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    restart: "no"

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: aluno
      GF_SECURITY_ADMIN_PASSWORD: devops
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/esta-vm.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana-dados:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256m
    restart: "no"

  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    network_mode: host
    environment:
      UPTIME_KUMA_HOST: 127.0.0.1
      UPTIME_KUMA_PORT: "3001"
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - kuma-dados:/app/data
    mem_limit: 256m
    restart: "no"

volumes:
  prometheus-dados:
  grafana-dados:
  kuma-dados:
