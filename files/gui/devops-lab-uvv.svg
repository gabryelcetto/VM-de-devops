  <g font-family="Ubuntu, 'DejaVu Sans', sans-serif" text-anchor="end">
    <text x="1800" y="560" font-size="104" font-weight="700" fill="#e8f3ff">DevOps Lab</text>
    <text x="1800" y="660" font-size="76" font-weight="700" fill="#2dd4bf" letter-spacing="10">UVV</text>
    <text x="1800" y="730" font-size="27" fill="#9fb6c8">VS Code · Docker · Git · Ansible · Terraform · Python · Jenkins</text>
  </g>
