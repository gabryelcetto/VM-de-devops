    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9fd8ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- símbolo do ciclo DevOps (infinito) -->
  <path d="M1500 360 C1550 305 1610 305 1610 360 C1610 415 1550 415 1500 360 C1450 305 1390 305 1390 360 C1390 415 1450 415 1500 360 Z"
