<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1622"/>
      <stop offset="0.55" stop-color="#11293a"/>
      <stop offset="1" stop-color="#173f4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9fd8ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <text x="960" y="500" text-anchor="middle" font-family="Ubuntu, 'DejaVu Sans', sans-serif"
        font-size="150" font-weight="700" fill="#e8f3ff" letter-spacing="2">DevOps</text>
  <!-- símbolo do ciclo DevOps (infinito) -->
  <path d="M960 640 C1035 557 1125 557 1125 640 C1125 723 1035 723 960 640 C885 557 795 557 795 640 C795 723 885 723 960 640 Z"
        fill="none" stroke="url(#loop)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
