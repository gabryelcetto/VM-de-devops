<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="painel-token" content="__TOKEN__">
<title>Painel DevOps</title>
<style>
:root{
  --lado:#18212b; --lado-texto:#b6c2ce; --lado-fraco:#7d8b99; --lado-ativo:#243243; --lado-linha:#263342;
  --fundo:#f2f4f7; --sup:#ffffff; --sup2:#f7f9fb; --borda:#dce2e9; --borda2:#c6cfd9;
  --texto:#1c2632; --fraco:#5b6a7a; --fraco2:#8a97a5;
  --acento:#0d7c72; --acento-esc:#09625a; --acento-claro:#e2f2f0;
  --ok:#1e8f4e; --ok-claro:#e3f4ea; --erro:#c93636; --erro-claro:#fbe8e8;
  --aviso:#a86d08; --aviso-claro:#fcf1d9; --info:#2565c7; --info-claro:#e6eefb;
  --mono:'Ubuntu Mono','DejaVu Sans Mono',monospace;
  --raio:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;background:var(--fundo);color:var(--texto);font:14px/1.5 'Ubuntu','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

/* ---------- menu lateral ---------- */
aside{width:224px;flex:none;background:var(--lado);color:var(--lado-texto);display:flex;flex-direction:column;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.marca svg{width:30px;height:30px;flex:none}
.marca b{display:block;color:#fff;font-size:15px;line-height:1.2}
.marca span{font-size:12px;color:var(--lado-fraco)}
nav{display:flex;flex-direction:column;padding:4px 10px;gap:1px}
nav .grupo{font-size:12px;color:var(--lado-fraco);padding:16px 10px 6px}
nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--lado-texto);padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;position:relative}
nav button svg{width:18px;height:18px;flex:none;opacity:.85}
nav button:hover{background:#1f2a36;color:#fff}
nav button.ativo{background:var(--lado-ativo);color:#fff;font-weight:500}
nav button.ativo::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#3cc6b6}
nav button .cont{margin-left:auto;font-size:11.5px;color:var(--lado-fraco)}
.saude{margin-top:auto;padding:14px 18px 16px;border-top:1px solid var(--lado-linha);font-size:12.5px;display:flex;flex-direction:column;gap:7px}
.saude .lin{display:flex;align-items:center;gap:8px}
.saude .lin span:last-child{margin-left:auto;color:var(--lado-fraco)}
.saude .medidor{height:5px;background:#2b3846;border-radius:3px;overflow:hidden}
.saude .medidor i{display:block;height:100%;background:#3cc6b6}
.saude .medidor.alto i{background:#e0a02c}
.saude .atualizado{color:var(--lado-fraco);font-size:11.5px}

/* ---------- área principal ---------- */
#conteudo{flex:1;min-width:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.cab-pag{display:flex;align-items:flex-start;gap:16px;padding:22px 28px 0;flex-wrap:wrap}
.cab-pag h1{margin:0;font-size:21px;font-weight:500;letter-spacing:-.01em}
.cab-pag p{margin:3px 0 0;color:var(--fraco)}
.cab-pag .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#ajuda{padding:0 28px}
.ajuda{margin-top:14px;background:var(--info-claro);border:1px solid #c9daf6;border-radius:var(--raio);padding:12px 16px 12px 14px;color:#1c3c6e}
.ajuda ol{margin:0;padding-left:20px}
.ajuda li{margin:3px 0}
.abas{display:flex;gap:2px;padding:0 28px;margin-top:16px;border-bottom:1px solid var(--borda)}
.abas button{background:none;border:0;padding:9px 12px 10px;color:var(--fraco);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:7px;align-items:center}
.abas button:hover{color:var(--texto)}
.abas button.ativo{color:var(--texto);border-bottom-color:var(--acento);font-weight:500}
.abas button .cont{font-size:12px;background:#e7ebf0;color:var(--fraco);border-radius:10px;padding:0 7px}
main{padding:18px 28px 60px;flex:1}
section{display:none} section.ativo{display:block}
h2{font-size:15px;font-weight:500;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2:first-child{margin-top:4px}
h2 .sub{font-weight:400}
.sub{color:var(--fraco);font-size:12.5px}
.mono{font-family:var(--mono);font-size:13.5px}
.fraco{color:var(--fraco)}

/* ---------- superfícies ---------- */
.painel{background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);min-width:0}
.painel > h3{margin:0;padding:13px 16px;font-size:14px;font-weight:500;border-bottom:1px solid var(--borda);display:flex;align-items:center;gap:8px}
.painel .corpo-p{padding:14px 16px}
.duas{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.faixa{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);margin-bottom:16px}
.faixa > div{padding:13px 16px;border-right:1px solid var(--borda);min-width:0}
.faixa > div:last-child{border-right:0}
.faixa .r{color:var(--fraco);font-size:12.5px}
.faixa .n{font-size:22px;font-weight:500;margin-top:2px;line-height:1.3}
.faixa .d{color:var(--fraco);font-size:12.5px}
.faixa .clic{cursor:pointer}
.faixa .clic:hover{background:var(--sup2)}
.medidor{height:6px;background:#e7ebf0;border-radius:3px;overflow:hidden;margin-top:8px}
.medidor i{display:block;height:100%;background:var(--acento);border-radius:3px}
.medidor.alto i{background:var(--aviso)}

/* ---------- tabelas ---------- */
.ferramentas{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ferramentas input[type=search]{max-width:280px}
.ferramentas .sub{margin-left:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);overflow:hidden}
table.t th{text-align:left;font-weight:500;font-size:12.5px;color:var(--fraco);background:var(--sup2);padding:9px 14px;border-bottom:1px solid var(--borda);white-space:nowrap}
table.t td{padding:10px 14px;border-bottom:1px solid #e9edf2;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:#fafbfc}
table.t td.acoes{text-align:right;white-space:nowrap;width:1%}
table.t td.acoes > *{margin-left:4px}
table.t .nome{font-weight:500}
table.t .nome + .sub{margin-top:1px}
table.t tr.clic{cursor:pointer}
.cel-nome{display:flex;align-items:center;gap:10px;min-width:0}
.cel-nome > div{min-width:0}
.cel-nome .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.desativado td{opacity:.6}

/* ---------- estados ---------- */
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fraco2);flex:none}
.st.ok::before{background:var(--ok)} .st.erro::before{background:var(--erro)} .st.aviso::before{background:var(--aviso)} .st.info::before{background:var(--info)}
.st.anim::before{animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.35}}
.etq{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;white-space:nowrap;background:#eaeef2;color:var(--fraco);line-height:1.6}
.etq.ok{background:var(--ok-claro);color:var(--ok)} .etq.erro{background:var(--erro-claro);color:var(--erro)}
.etq.aviso{background:var(--aviso-claro);color:var(--aviso)} .etq.info{background:var(--info-claro);color:var(--info)}
.etq.acento{background:var(--acento-claro);color:var(--acento-esc)}
.historico{display:inline-flex;gap:3px;vertical-align:middle}
.historico i{width:9px;height:14px;border-radius:2px;display:inline-block;cursor:pointer}
.etapas{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.etapas span{font-size:11.5px;padding:0 7px;border-radius:4px;background:#eaeef2;color:var(--fraco);line-height:1.7}
.etapas span.SUCCESS{background:var(--ok-claro);color:var(--ok)} .etapas span.FAILED{background:var(--erro-claro);color:var(--erro)}
.etapas span.IN_PROGRESS{background:var(--aviso-claro);color:var(--aviso)}

/* ---------- botões e campos ---------- */
.b{background:var(--sup);border:1px solid var(--borda2);border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.4;color:var(--texto)}
.b:hover{background:var(--sup2);border-color:#b3bfcb}
.b svg{width:15px;height:15px;flex:none}
.b.pri{background:var(--acento);border-color:var(--acento);color:#fff}
.b.pri:hover{background:var(--acento-esc);border-color:var(--acento-esc)}
.b.perigo{color:var(--erro)}
.b.perigo:hover{border-color:var(--erro);background:var(--erro-claro)}
.b.peq{padding:4px 9px;font-size:13px}
.b.icone{padding:5px;width:30px;height:30px;justify-content:center}
.b.leve{border-color:transparent;background:none}
.b.leve:hover{background:#e9edf2}
.b:disabled{opacity:.55;cursor:wait}
.grupo-b{display:inline-flex}
.grupo-b .b{border-radius:0;margin-left:-1px}
.grupo-b .b:first-child{border-radius:6px 0 0 6px;margin-left:0}
.grupo-b .b:last-child{border-radius:0 6px 6px 0}
input,select,textarea{background:#fff;border:1px solid var(--borda2);border-radius:6px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-claro)}
textarea{font-family:var(--mono);font-size:13.5px;min-height:360px;tab-size:2;line-height:1.45;resize:vertical}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--fraco)}
label.campo .dica{font-size:12px;color:var(--fraco2)}
label.check{display:flex;align-items:center;gap:8px;color:var(--texto);font-size:13.5px}
label.check input{width:auto}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.campos .largo{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- vazio e avisos na página ---------- */
.vazio{background:var(--sup);border:1px dashed var(--borda2);border-radius:var(--raio);padding:36px 20px;text-align:center;color:var(--fraco)}
.vazio b{display:block;color:var(--texto);font-size:15px;font-weight:500;margin-bottom:4px}
.vazio .chips{justify-content:center;margin-top:14px}
.faixa-aviso{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--aviso-claro);border:1px solid #efd9a6;color:#6e4a06;border-radius:var(--raio);padding:11px 14px;margin-bottom:14px}
.faixa-aviso.info{background:var(--info-claro);border-color:#c9daf6;color:#1c3c6e}
.faixa-aviso .b{margin-left:auto}

/* ---------- configurações (Git) ---------- */
.config{background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio)}
.config .item-c{display:flex;gap:20px;padding:16px 18px;border-bottom:1px solid var(--borda);align-items:flex-start;flex-wrap:wrap}
.config .item-c:last-child{border-bottom:0}
.config .item-c > div:first-child{flex:1;min-width:260px}
.config .item-c b{font-weight:500;display:flex;gap:8px;align-items:center}
.config .item-c p{margin:3px 0 0;color:var(--fraco);font-size:13px}
.config .item-c .valor{font-family:var(--mono);font-size:12.5px;color:var(--fraco);word-break:break-all;margin-top:6px;max-height:40px;overflow:hidden}

/* ---------- janela (modal) ---------- */
#modal{position:fixed;inset:0;background:rgba(17,25,34,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#modal.aberto{display:flex}
#modal .caixa{background:var(--sup);border-radius:10px;width:min(1080px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,23,32,.25)}
#modal .mcab{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--borda);gap:10px}
#modal .mcab b{font-size:16px;font-weight:500}
#modal .mcab .x{margin-left:auto}
#modal .corpo{padding:18px 20px;overflow:auto}
#modal .rod{padding:12px 20px;border-top:1px solid var(--borda);display:flex;gap:8px;justify-content:flex-end;align-items:center;background:var(--sup2);border-radius:0 0 10px 10px}
#modal .rod:empty{display:none}
pre.saida{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13px;background:#1c2530;color:#d6dee7;padding:14px;border-radius:6px;min-height:220px;max-height:60vh;overflow:auto}
/* assistente: modelos à esquerda, formulário à direita */
.assist{display:grid;grid-template-columns:250px 1fr;gap:22px;min-height:380px}
.assist h4{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--fraco)}
.modelos{display:flex;flex-direction:column;gap:4px}
.modelo{background:none;border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.modelo:hover{background:var(--sup2);border-color:var(--borda)}
.modelo.sel{background:var(--acento-claro);border-color:#a9d9d3}
.modelo b{display:block;font-weight:500}
.modelo span{color:var(--fraco);font-size:12.5px}
.grade-modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.grade-modelos .modelo{border-color:var(--borda)}

/* ---------- menu "⋯" ---------- */
.menu-pop{position:fixed;z-index:40;background:var(--sup);border:1px solid var(--borda);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,32,.18);padding:4px;min-width:190px}
.menu-pop button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;padding:7px 10px;border-radius:5px;cursor:pointer;text-align:left}
.menu-pop button:hover{background:var(--sup2)}
.menu-pop button.perigo{color:var(--erro)}
.menu-pop button svg{width:15px;height:15px;color:var(--fraco)}
.menu-pop hr{border:0;border-top:1px solid var(--borda);margin:4px 2px}

/* ---------- avisos ---------- */
#avisos{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:440px}
.toast{background:var(--sup);border:1px solid var(--borda);border-left:4px solid var(--ok);padding:11px 14px;border-radius:6px;white-space:pre-wrap;box-shadow:0 8px 24px rgba(15,23,32,.14);animation:entra .18s ease-out}
.toast.erro{border-left-color:var(--erro)}
@keyframes entra{from{transform:translateY(6px);opacity:0}}
.girando{display:inline-block;width:13px;height:13px;border:2px solid var(--aviso);border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite;flex:none;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- gráficos ---------- */
svg.graf{width:100%;display:block}
svg.graf text{fill:var(--fraco);font-size:11px;font-family:inherit}
.legenda{display:flex;gap:14px;font-size:12.5px;color:var(--fraco);flex-wrap:wrap;margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.lista-atv{display:flex;flex-direction:column}
.atv{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #edf0f4;cursor:pointer}
.atv:last-child{border-bottom:0}
.atv:hover .tit{color:var(--acento-esc)}
.atv .tit{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){
  aside{width:62px} nav button span, nav .grupo, .marca div, .saude{display:none} nav button.ativo::before{display:none}
  .assist{grid-template-columns:1fr} .campos{grid-template-columns:1fr} .duas{grid-template-columns:1fr}
  .cab-pag,#ajuda,.abas,main{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<aside>
  <div class="marca">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0d7c72"/><path d="M9.5 20.5c-2.5 0-4.5-2-4.5-4.5s2-4.5 4.5-4.5c4.3 0 8.7 9 13 9 2.5 0 4.5-2 4.5-4.5s-2-4.5-4.5-4.5c-4.3 0-8.7 9-13 9z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div><b>Painel DevOps</b><span>DevOps-Lab</span></div>
  </div>
  <nav id="menu">
    <button data-aba="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Visão geral</span></button>
    <div class="grupo">Ferramentas</div>
    <button data-aba="docker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="5" height="4"/><rect x="8" y="10" width="5" height="4"/><rect x="13" y="10" width="5" height="4"/><rect x="8" y="6" width="5" height="4"/><path d="M2 14h19c-1 4-5 6-10 6S3 18 2 14z"/></svg><span>Docker</span><span class="cont" id="n-docker"></span></button>
    <button data-aba="jenkins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h2M14.5 12h2"/></svg><span>Jenkins</span><span class="cont" id="n-jenkins"></span></button>
    <button data-aba="git"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 7.5v9M18 11.5c0 4-6 3-11.5 6"/></svg><span>Git</span></button>
    <button data-aba="vscode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 2v14l-4 2L7 13l-4 3-1-1V9l1-1 4 3L17 3zM17 8l-5 4 5 4z"/></svg><span>VS Code</span></button>
    <button data-aba="ansible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 17l4-10 4 10M10 13l5 2.5"/></svg><span>Ansible</span></button>
    <button data-aba="terraform"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4l5 3v6L3 10zM9.5 7.5l5 3v6l-5-3zM16 10.5l5-3v6l-5 3zM9.5 15l5 3v4l-5-3z"/></svg><span>Terraform</span></button>
    <button data-aba="python"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c-4 0-4 1.5-4 3v2h4.5v1H6c-2 0-3 1.5-3 4s1 4 3 4h1.5v-2.5c0-1.5 1-2.5 2.5-2.5h4.5c1.5 0 2.5-1 2.5-2.5V6c0-1.5-1-3-5-3z"/><path d="M12 21c4 0 4-1.5 4-3v-2h-4.5v-1H18c2 0 3-1.5 3-4"/></svg><span>Python</span></button>
    <div class="grupo">Laboratório</div>
    <button data-aba="atividades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="17" r="3"/></svg><span>Atividades</span><span class="cont" id="n-atividades"></span></button>
    <button data-aba="sistema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M6 12l3-3 3 2 4-4"/></svg><span>Sistema</span></button>
  </nav>
  <div class="saude" id="saude">
    <div class="lin"><span class="st" id="sd-docker">Docker</span><span id="sd-docker-t">—</span></div>
    <div class="lin"><span class="st" id="sd-jenkins">Jenkins</span><span id="sd-jenkins-t">—</span></div>
    <div class="lin"><span>Memória</span><span id="sd-mem">—</span></div>
    <div class="medidor" id="sd-mem-b"><i style="width:0"></i></div>
    <div class="atualizado" id="atualizado">—</div>
  </div>
</aside>

<div id="conteudo">

<script>
const TOKEN = document.querySelector('meta[name="painel-token"]').content;
let ABA = 'inicio', ocupado = false, DADOS = {};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A = v => esc(JSON.stringify(v));
const J = v => JSON.stringify(v);   /* valor dentro do JS de BT() e M() (que já escapam) */
const mb = n => n >= 1024 ? (n/1024).toFixed(1).replace('.', ',') + ' GB' : Math.round(n) + ' MB';
const quando = ms => { if(!ms) return ''; const s = (Date.now()-ms)/1000; return s < 60 ? 'agora' : s < 3600 ? 'há ' + Math.round(s/60) + ' min' : s < 86400 ? 'há ' + Math.round(s/3600) + ' h' : new Date(ms).toLocaleDateString('pt-BR'); };
const dur = ms => !ms ? '' : ms < 1000 ? ms + ' ms' : ms < 60000 ? (ms/1000).toFixed(1).replace('.', ',') + ' s' : Math.floor(ms/60000) + ' min ' + Math.round(ms%60000/1000) + ' s';
const base = c => c.split('/').pop();
const pai = c => c.replace(/\/[^/]+$/, '');
const curto = c => String(c || '').replace(/^\/home\/[^/]+/, '~');

/* ================= ícones ================= */
const I = {
  play:'<path d="M7 4l13 8-13 8z"/>', parar:'<rect x="6" y="6" width="12" height="12" rx="1"/>', reiniciar:'<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>',
  terminal:'<path d="M4 17l6-6-6-6M12 19h8"/>', logs:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>', lixo:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  mais:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>', novo:'<path d="M12 5v14M5 12h14"/>',
  abrir:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>', editar:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  copiar:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', relogio:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chave:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>', branch:'<circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M6 7.5v9M18 9.5c0 5-12 2-12 7"/>',
  subir:'<path d="M12 19V5M5 12l7-7 7 7"/>', descer:'<path d="M12 5v14M19 12l-7 7-7-7"/>', pasta:'<path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>',
  codigo:'<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>', baixar:'<path d="M12 3v12M6 10l6 6 6-6M4 21h16"/>', busca:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  ajuda:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.5"/>', ok:'<path d="M5 12l5 5 9-10"/>',
  energia:'<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>', compose:'<rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="8" y="13" width="8" height="7" rx="1"/>',
  imagem:'<path d="M12 3l9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>', rede:'<circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5v4M12 11.5l-6 5M12 11.5l6 5"/>',
  disco:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>', limpar:'<path d="M4 20l7-7M14 4l6 6-8 8-6-6z"/>',
};
const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n] || ''}</svg>`;
/* botão: BT('Texto', 'js', {pri, perigo, icone:'play', so_icone, titulo}) */
function BT(txt, js, o){
  o = o || {};
  const cls = ['b', 'peq', o.pri ? 'pri' : '', o.perigo ? 'perigo' : '', o.so_icone ? 'icone' : ''].join(' ');
  return `<button class="${cls}" title="${esc(o.titulo || (o.so_icone ? txt : ''))}" onclick="${esc(js)}">${o.icone ? ico(o.icone) : ''}${o.so_icone ? '' : esc(txt)}</button>`;
}
/* menu "⋯": itens = [{t, js, i, p (perigo)} ou '-'] */
function M(itens){ return `<button class="b leve icone" title="Mais ações" onclick='abrirMenu(this, ${A(itens.filter(Boolean))})'>${ico('mais')}</button>`; }
function abrirMenu(btn, itens){
  fecharMenu();
  const m = document.createElement('div'); m.className = 'menu-pop'; m.id = 'menu-pop';
  itens.forEach(it => {
    if(it === '-'){ m.appendChild(document.createElement('hr')); return; }
    const e = document.createElement('button'); if(it.p) e.className = 'perigo';
    e.innerHTML = (it.i ? ico(it.i) : '') + esc(it.t);
    e.onclick = ev => { ev.stopPropagation(); fecharMenu(); try{ new Function(it.js).call(btn); }catch(x){ toast(x.message, true); } };
    m.appendChild(e);
  });
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h + 6 > innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
  setTimeout(() => document.addEventListener('click', fecharMenu, {once:true}), 0);
}
function fecharMenu(){ const m = $('#menu-pop'); if(m) m.remove(); }
addEventListener('scroll', fecharMenu, true);

/* ================= comunicação ================= */
function toast(msg, erro){ const d = document.createElement('div'); d.className = 'toast' + (erro ? ' erro' : ''); d.textContent = msg; $('#avisos').appendChild(d); setTimeout(() => d.remove(), erro ? 10000 : 5000); }
async function get(url){ const r = await fetch(url); const j = await r.json(); if(!r.ok) throw new Error(j.erro || r.statusText); return j; }
async function post(url, dados, btn){
  if(btn) btn.disabled = true;
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-Painel-Token':TOKEN}, body:JSON.stringify(dados)});
    const j = await r.json(); if(!r.ok) throw new Error(j.erro || r.statusText); return j.resultado;
  } finally { if(btn) btn.disabled = false; }
}
async function acao(url, dados, btn, titulo){
  try{
    const res = await post(url, dados, btn);
    if(titulo) modalTexto(titulo, typeof res === 'string' ? res : JSON.stringify(res, null, 2));
    else toast(typeof res === 'string' ? res.slice(-600) : (res && res.msg) || 'Feito.');
    carregar(true); return res;
  }catch(e){ toast(e.message, true); }
}
async function executar(dados, btn){
  try{ const r = await post('/api/executar', dados, btn); abrirConsole(r.tarefa, r.titulo); return r; }
  catch(e){ toast(e.message, true); }
}
function abrir(tipo, caminho, extra){ acao('/api/abrir', {acao:tipo, caminho, ...(extra||{})}); }
function abrirUrl(url){ acao('/api/abrir', {acao:'url', url}); }

/* ================= janelas ================= */
let consoleTimer = null;
function abrirModal(titulo, sub, html, botoes){
  clearTimeout(consoleTimer); fecharMenu();
  $('#m-titulo').textContent = titulo; $('#m-sub').textContent = sub || '';
  $('#m-corpo').innerHTML = html; $('#m-rod').innerHTML = '';
  (botoes || []).forEach(b => { const e = document.createElement('button'); e.className = 'b ' + (b.cls||''); e.innerHTML = b.txt; e.onclick = () => b.fn(e); $('#m-rod').appendChild(e); });
  $('#modal').classList.add('aberto');
}
function fecharModal(){ clearTimeout(consoleTimer); $('#modal').classList.remove('aberto'); carregar(true); }
function modalTexto(titulo, texto){ abrirModal(titulo, '', '<pre class="saida">' + esc(texto) + '</pre>'); const p = $('#m-corpo pre'); p.scrollTop = p.scrollHeight; }
function modalEditor(titulo, sub, texto, botoes){
  abrirModal(titulo, sub, '<textarea id="m-edit" spellcheck="false"></textarea>', botoes);
  const t = $('#m-edit'); t.value = texto; t.focus();
  t.addEventListener('keydown', e => { if(e.key === 'Tab'){ e.preventDefault(); t.setRangeText('  ', t.selectionStart, t.selectionEnd, 'end'); } });
}
function abrirConsole(id, titulo){
  abrirModal(titulo, '', '<div id="c-estado" style="margin-bottom:10px"></div><pre id="c-saida" class="saida"></pre>',
    [{txt:ico('parar') + 'Parar', cls:'perigo', fn: b => post('/api/tarefa-parar', {id}, b).then(toast).catch(e => toast(e.message, true))}]);
  let desde = 0;
  const passo = async () => {
    try{
      const t = await get('/api/tarefa?id=' + id + '&desde=' + desde);
      const pre = $('#c-saida'); if(!pre) return;
      const noFim = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
      if(t.linhas.length){ pre.textContent += t.linhas.join('\n') + '\n'; desde = t.total; if(noFim) pre.scrollTop = pre.scrollHeight; }
      $('#c-estado').innerHTML = t.fim
        ? (t.codigo === 0 ? '<span class="st ok">Concluído</span>' : `<span class="st erro">Terminou com erro (código ${t.codigo})</span>`) + ` <span class="sub" style="margin-left:8px">${dur(t.duracao)} · <span class="mono">${esc(t.comando)}</span></span>`
        : `<span class="st aviso anim">Rodando</span> <span class="sub mono" style="margin-left:8px">${esc(t.comando)}</span>`;
      if(!t.fim) consoleTimer = setTimeout(passo, 700);
    }catch(e){ if($('#c-estado')) $('#c-estado').textContent = e.message; }
  };
  passo();
}
function esperarTarefa(id){ return new Promise(res => { const v = async () => { try{ const t = await get('/api/tarefa?id=' + id); if(t.fim) return res(t); }catch(e){ return res(null); } setTimeout(v, 800); }; v(); }); }

/* criação com modelos: lista de modelos à esquerda, formulário à direita */
function assistente(titulo, modelos, campos, aoCriar, rotulo){
  let sel = 0;
  abrirModal(titulo, '', `<div class="assist"><div><h4>Modelo</h4><div class="modelos">${modelos.map((m,i) => `<button class="modelo${i?'':' sel'}" data-i="${i}"><b>${esc(m.nome)}</b><span>${esc(m.desc)}</span></button>`).join('')}</div></div>
    <div><h4>Configuração</h4><div class="campos" id="a-campos"></div></div></div>`,
    [{txt: rotulo || 'Criar', cls:'pri', fn: async b => {
      const v = {}; campos.forEach(c => { const e = document.getElementById('a-' + c.id); if(e) v[c.id] = c.tipo === 'check' ? e.checked : e.value; });
      await aoCriar(v, modelos[sel], b);
    }}]);
  const desenhar = () => {
    const m = modelos[sel];
    $('#a-campos').innerHTML = campos.filter(c => !c.so || c.so(m)).map(c => {
      const val = m.valores?.[c.id] ?? c.padrao ?? '';
      const dica = c.ajuda ? `<span class="dica">${esc(c.ajuda)}</span>` : '';
      if(c.tipo === 'area') return `<label class="campo largo">${esc(c.rot)}<textarea id="a-${c.id}" spellcheck="false" style="min-height:${c.alt||260}px">${esc(val)}</textarea>${dica}</label>`;
      if(c.tipo === 'check') return `<label class="check largo"><input type="checkbox" id="a-${c.id}" ${val?'checked':''}>${esc(c.rot)}</label>`;
      if(c.tipo === 'memoria') return `<label class="campo">${esc(c.rot)}<input id="a-${c.id}" value="${esc(val)}" placeholder="ex.: 512m, 1g (vazio = sem limite)">
        <span class="chips">${['256m','512m','1g','2g',''].map(x => `<button type="button" class="b peq" onclick='const e=document.getElementById("a-${c.id}");e.value=${A(x)};e.dispatchEvent(new Event("input",{bubbles:true}))'>${x || 'sem limite'}</button>`).join('')}</span></label>`;
      if(c.tipo === 'select') return `<label class="campo">${esc(c.rot)}<select id="a-${c.id}">${c.opcoes().map(o => `<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>${dica}</label>`;
      return `<label class="campo${c.largo ? ' largo' : ''}">${esc(c.rot)}<input id="a-${c.id}" value="${esc(val)}" placeholder="${esc(c.dica||'')}">${dica}</label>`;
    }).join('');
  };
  document.querySelectorAll('#modal .modelo').forEach(b => b.onclick = () => { sel = +b.dataset.i; document.querySelectorAll('#modal .modelo').forEach(x => x.classList.toggle('sel', x === b)); desenhar(); });
  $('#a-campos').addEventListener('input', e => { const c = campos.find(x => 'a-' + x.id === e.target.id); if(c && c.aoMudar) c.aoMudar(e.target.value); });
  desenhar();
}
/* troca o limite de memória dentro de um script/compose já escrito */
const MEM_OK = v => !v || /^\d{1,6}[bkmgBKMG]?$/.test(v.trim());
function trocarMemoriaScript(id, mem){
  const t = document.getElementById(id); if(!t || !MEM_OK(mem)) return; mem = mem.trim();
  t.value = t.value.replace(/ --memory=\S+ --memory-swap=\S+/g, '').replace(/docker run (-d|--rm) /g, (x, op) => mem ? `docker run ${op} --memory=${mem} --memory-swap=${mem} ` : `docker run ${op} `);
}
function trocarMemoriaCompose(id, mem){
  const t = document.getElementById(id); if(!t || !MEM_OK(mem)) return; mem = mem.trim();
  t.value = t.value.replace(/\n\s+mem_limit: \S+/g, '').replace(/(\n(\s+)image: [^\n]+)/g, (m, linha, ind) => mem ? `${linha}\n${ind}mem_limit: ${mem}` : linha);
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if($('#menu-pop')) return fecharMenu(); if($('#modal').classList.contains('aberto')) fecharModal(); } });

/* ================= gráficos ================= */
const COR = {cpu:'#2565c7', mem:'#0d7c72', grade:'#e6ebf0', vazio:'#d5dce4'};
function graficoLinha(el, t, series, maxes){
  const W = 600, H = 170, P = 34;
  if(t.length < 2){ el.innerHTML = '<div class="sub" style="padding:36px 0;text-align:center">Coletando dados — o gráfico aparece em alguns segundos.</div>'; return; }
  const x = i => P + (W - P - 8) * i / (t.length - 1);
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  [0, .5, 1].forEach(f => { const y = 8 + (H - 30) * (1 - f); svg += `<line x1="${P}" x2="${W-8}" y1="${y}" y2="${y}" stroke="${COR.grade}"/><text x="2" y="${y+4}">${Math.round(f*100)}%</text>`; });
  series.forEach((s, k) => {
    const pts = s.v.map((v, i) => `${x(i).toFixed(1)},${(8 + (H-30) * (1 - Math.min(v, maxes[k]) / maxes[k])).toFixed(1)}`).join(' ');
    svg += `<polygon points="${P},${H-22} ${pts} ${x(s.v.length-1).toFixed(1)},${H-22}" fill="${s.cor}" opacity=".08"/><polyline points="${pts}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round"/>`;
  });
  const hm = ms => new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  el.innerHTML = svg + `<text x="${P}" y="${H-4}">${hm(t[0])}</text><text x="${W-42}" y="${H-4}">${hm(t[t.length-1])}</text></svg>`;
}
function graficoRosca(el, partes){
  const total = partes.reduce((a, p) => a + p.v, 0);
  if(!total){ el.innerHTML = vazio('Nenhum container ainda', 'Crie um a partir de um modelo pronto.', BT('Novo container', "irPara('docker');novoContainer()", {pri:1, icone:'novo'})); return; }
  let ang = -Math.PI/2, svg = `<svg class="graf" viewBox="0 0 330 150" style="max-width:440px">`;
  const R = 62, r = 42, cx = 75, cy = 75, P = (a, rr) => `${(cx + rr*Math.cos(a)).toFixed(2)},${(cy + rr*Math.sin(a)).toFixed(2)}`;
  partes.filter(p => p.v).forEach(p => {
    const a2 = ang + 2*Math.PI * p.v / total, g = a2 - ang > Math.PI ? 1 : 0;
    svg += p.v === total ? `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p.cor}" stroke-width="${R-r}"/>`
      : `<path d="M${P(ang,R)} A${R},${R} 0 ${g} 1 ${P(a2,R)} L${P(a2,r)} A${r},${r} 0 ${g} 0 ${P(ang,r)}Z" fill="${p.cor}"/>`;
    ang = a2;
  });
  svg += `<text x="${cx}" y="${cy+8}" text-anchor="middle" style="font-size:24px;fill:#1c2632">${total}</text>`;
  partes.forEach((p, i) => svg += `<rect x="175" y="${32+i*26}" width="12" height="12" rx="2" fill="${p.cor}"/><text x="194" y="${43+i*26}" style="font-size:13px;fill:#1c2632">${esc(p.n)}: ${p.v}</text>`);
  el.innerHTML = svg + '</svg>';
}
function graficoBarras(el, itens, cor){
  const W = 600, H = 160, max = Math.max(1, ...itens.map(i => i.v)), bw = (W - 20) / itens.length;
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  itens.forEach((it, i) => { const h = (H - 36) * it.v / max, x = 10 + i*bw;
    svg += `<rect x="${(x+3).toFixed(1)}" y="${(H-22-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${Math.max(h, 2).toFixed(1)}" rx="2" fill="${it.v ? cor : COR.vazio}"><title>${esc(it.r)}: ${it.v}</title></rect>`;
    if(it.v) svg += `<text x="${(x+bw/2).toFixed(1)}" y="${(H-26-h).toFixed(1)}" text-anchor="middle">${it.v}</text>`;
    if(i % 2 === 0) svg += `<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(it.r)}</text>`; });
  el.innerHTML = svg + '</svg>';
}
const COR_BUILD = r => ({SUCCESS:'#1e8f4e', FAILURE:'#c93636', UNSTABLE:'#a86d08', ABORTED:'#8a97a5', 'EM ANDAMENTO':'#2565c7'})[r] || '#c6cfd9';
function graficoBuilds(el, builds){
  if(!builds.length){ el.innerHTML = vazio('Nenhum build ainda', 'Crie um pipeline e clique em Construir.', BT('Novo item no Jenkins', "irPara('jenkins');novoItemJenkins()", {pri:1, icone:'novo'})); return; }
  const W = 600, H = 160, max = Math.max(1000, ...builds.map(b => b.d || 0)), bw = (W - 20) / Math.max(builds.length, 12);
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  builds.forEach((b, i) => { const h = Math.max(6, (H - 34) * (b.d || 0) / max), x = 10 + i*bw;
    svg += `<rect x="${(x+2).toFixed(1)}" y="${(H-22-h).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${COR_BUILD(b.r)}" style="cursor:pointer" onclick='acao("/api/jenkins",{acao:"console",job:${A(b.job)},numero:${b.n}},null,${A(b.job + " #" + b.n)})'><title>${esc(b.job)} #${b.n} — ${esc(b.r||'')} — ${dur(b.d)}</title></rect>`; });
  el.innerHTML = svg + `<text x="10" y="${H-6}">mais antigos</text><text x="${W-90}" y="${H-6}">mais recentes</text></svg><div class="legenda"><span><i style="background:#1e8f4e"></i>Sucesso</span><span><i style="background:#c93636"></i>Falha</span><span><i style="background:#2565c7"></i>Rodando</span><span>Altura = duração. Clique para ver o console.</span></div>`;
}

/* "Up 5 minutes" -> "Ligado há 5 min" */
function tempoPt(s){
  return String(s || '').replace(/About a minute/, '1 min').replace(/About an hour/, '1 h').replace(/Less than a second/, 'menos de 1 s')
    .replace(/(\d+) seconds?/, '$1 s').replace(/(\d+) minutes?/, '$1 min').replace(/(\d+) hours?/, '$1 h').replace(/(\d+) days?/, '$1 dias')
    .replace(/(\d+) weeks?/, '$1 semanas').replace(/(\d+) months?/, '$1 meses').replace(/(\d+) years?/, '$1 anos');
}
function statusPt(c){
  const s = c.status || '';
  let m = s.match(/^Exited \((\d+)\) (.*) ago/);
  if(m) return m[1] === '0' ? `Parou há ${tempoPt(m[2])}: o programa principal terminou` : `Parou com erro (código ${m[1]}) há ${tempoPt(m[2])}: veja os logs`;
  if(/^Up /.test(s)) return 'Ligado há ' + tempoPt(s.replace(/^Up /, '')).replace(/\(healthy\)/, '(saudável)').replace(/\(unhealthy\)/, '(com problema)').replace(/\(Paused\)/, '(pausado)');
  if(s === 'Created') return 'Criado, ainda não iniciado';
  return s;
}
const agoPt = s => /ago$/.test(s || '') ? 'há ' + tempoPt(s.replace(/ ago$/, '')) : s;

async function jkConstruir(nome, btn){

function gitCommit(i){
  const r = DADOS.git.repos[i];
  const tipo = c => c.includes('?') ? ['ok','novo'] : c.includes('D') ? ['erro','apagado'] : ['aviso','alterado'];
  const arq = m => m.arquivo.replace(/^"|"$/g,'').split(' -> ').pop();
  abrirModal('Commit em ' + r.nome, 'branch ' + r.branch, `<p class="sub" style="margin-top:0">Marque os arquivos que entram no commit:</p>
    <table class="t">${r.mudancas.map(m => { const [c, t] = tipo(m.codigo);
      return `<tr><td style="width:1%"><input type="checkbox" checked data-arq="${esc(arq(m))}" style="width:auto"></td><td style="width:1%">${etq(c, t)}</td><td class="mono">${esc(m.arquivo)}</td>
        <td class="acoes"><button class="b peq perigo" title="desfazer as mudanças deste arquivo" onclick='if(confirm("Descartar as mudanças em "+${A(arq(m))}+"? Não dá para desfazer.")) post("/api/git",{acao:"descartar",repo:${A(r.caminho)},arquivo:${A(arq(m))},novo:${m.codigo.includes('?')}}).then(t=>{toast(t);this.closest("tr").remove()}).catch(e=>toast(e.message,true))'>Descartar</button></td></tr>`; }).join('')}</table>
    <label class="campo" style="margin-top:16px">Mensagem do commit (o que você fez)<input id="c-msg" placeholder="ex.: adiciona página inicial"></label>`,
    [{txt:'Ver mudanças', fn: b => acao('/api/git', {acao:'diff', repo:r.caminho}, b, 'Mudanças — ' + r.nome)},
     {txt:ico('ok') + 'Fazer commit', cls:'pri', fn: async b => {
      const arquivos = [...document.querySelectorAll('[data-arq]')].filter(x => x.checked).map(x => x.dataset.arq);
      if(!arquivos.length) return toast('Marque pelo menos um arquivo.', true);
      try{ toast(await post('/api/git', {acao:'commit', repo:r.caminho, mensagem:$('#c-msg').value, arquivos}, b)); fecharModal(); }catch(e){ toast(e.message, true); }
    }}]);
  setTimeout(() => $('#c-msg').focus(), 50);
}
function gitBranch(i){

async function apagarBranch(repo, branch){
  try{ toast(await post('/api/git', {acao:'apagar_branch', repo, branch})); fecharModal(); }

    if(confirm(e.message.slice(13) + '\n\nApagar mesmo assim?')){
      try{ toast(await post('/api/git', {acao:'apagar_branch', repo, branch, forcar:true})); fecharModal(); }catch(x){ toast(x.message, true); }
    }
  }
}

  const mod = {'variables.tf':'variable "nome" {\n  description = "Nome do recurso"\n  type        = string\n  default     = "devops"\n}\n', 'outputs.tf':'output "exemplo" {\n  value = "valor de saida"\n}\n', 'terraform.tfvars':'nome = "minha-turma"\n'};
  abrirModal('Novo arquivo do Terraform', curto(pasta), `<div class="grade-modelos">${Object.keys(mod).map(n => `<button class="modelo" onclick='$("#tf-n").value=${A(n)};$("#tf-c").value=${A(mod[n])}'><b class="mono">${esc(n)}</b></button>`).join('')}</div>
    <label class="campo" style="margin-top:16px">Nome<input id="tf-n" value="variables.tf"></label><label class="campo" style="margin-top:10px">Conteúdo<textarea id="tf-c" style="min-height:180px">${esc(mod['variables.tf'])}</textarea></label>`,
    [{txt:'Criar arquivo', cls:'pri', fn: async b => { try{ toast(await post('/api/arquivo', {acao:'salvar', caminho:pasta + '/' + $('#tf-n').value, conteudo:$('#tf-c').value}, b)); fecharModal(); }catch(e){ toast(e.message, true); } }}]);
}
async function carregarTerraform(){
  const t = await get('/api/terraform');
  const tf = (p, a) => `executar({ferramenta:"terraform",acao:"${a}",pasta:${J(p.pasta)}},this)`;
  $('#terraform').innerHTML = t.projetos.length ? tabela(['Projeto', 'Situação', 'Recursos criados', 'Passos', ''], t.projetos.map(p => `<tr>
    <td><div class="nome">${esc(p.nome)}</div><div class="sub mono">${esc(curto(p.pasta))}</div></td>
    <td>${p.iniciado ? st('ok', 'Iniciado') : st('aviso', 'Precisa de init')}</td>
    <td>${p.recursos.length ? `<span class="mono sub">${p.recursos.map(esc).join(', ')}</span>` : '<span class="fraco">nenhum</span>'}</td>
    <td><span class="grupo-b"><button class="b peq" onclick="${esc(tf(p, 'init'))}">1. Init</button><button class="b peq" onclick="${esc(tf(p, 'validate'))}">2. Validate</button><button class="b peq" onclick="${esc(tf(p, 'plan'))}">3. Plan</button><button class="b peq pri" onclick="${esc(tf(p, 'apply'))}">4. Apply</button></span></td>
    <td class="acoes">${M([{t:'Ver saídas (output)', i:'logs', js:tf(p, 'output')}, {t:'Ver estado (show)', i:'info', js:tf(p, 'show')}, {t:'Formatar arquivos (fmt)', i:'editar', js:tf(p, 'fmt')}, '-',
      ...p.arquivos.map(a => ({t:'Editar ' + a, i:'editar', js:`editarArquivo(${J(p.pasta + '/' + a)})`})), {t:'Novo arquivo .tf', i:'novo', js:`novoArquivoTf(${J(p.pasta)})`}, {t:'Abrir no VS Code', i:'codigo', js:`abrir("vscode",${J(p.pasta)})`}, '-',
      {t:'Destroy (apagar o que foi criado)', i:'lixo', p:1, js:'if(confirm("Destruir tudo o que este projeto criou?")) ' + tf(p, 'destroy')}])}</td></tr>`))
    : vazio('Nenhum projeto Terraform ainda', 'O modelo Variáveis e saídas funciona até sem internet.', BT('Novo projeto', 'novoTerraform()', {pri:1, icone:'novo'}));
}

/* ================= PYTHON ================= */
const MODELOS_PY = [
  {nome:'Olá mundo', desc:'Um script simples', valores:{nome:'ola-python', arquivo:'main.py', conteudo:`import platform\n\nnome = "turma de DevOps"\nprint(f"Ola, {nome}!")\nprint("Python", platform.python_version())\n`, req:''}},
  {nome:'API com Flask', desc:'Servidor web na porta 5000', valores:{nome:'api-flask', arquivo:'app.py', conteudo:`from flask import Flask, jsonify\n\napp = Flask(__name__)\n\n\n@app.get("/")\ndef inicio():\n    return jsonify(mensagem="Ola da API!", status="ok")\n\n\nif __name__ == "__main__":\n    app.run(host="0.0.0.0", port=5000)\n`, req:'flask\n'}},
  {nome:'Testes com pytest', desc:'Função + teste', valores:{nome:'testes-python', arquivo:'test_calc.py', conteudo:`def somar(a, b):\n    return a + b\n\n\ndef test_somar():\n    assert somar(2, 3) == 5\n\n\nif __name__ == "__main__":\n    import pytest\n    raise SystemExit(pytest.main(["-v", __file__]))\n`, req:'pytest\n'}},
];
function novoPython(){
  assistente('Novo projeto Python', MODELOS_PY, [{id:'nome', rot:'Nome da pasta (em ~/projetos)'}, {id:'arquivo', rot:'Arquivo principal'}, {id:'req', rot:'requirements.txt (pacotes, um por linha)', tipo:'area', alt:60}, {id:'conteudo', rot:'Código', tipo:'area', alt:230}, {id:'venv', rot:'Criar o ambiente .venv e instalar os pacotes', tipo:'check', padrao:true}],
  async (v, m, b) => {
    try{
      const arqs = {[v.arquivo]: v.conteudo, '.gitignore': GITIGNORE.Python}; if(v.req.trim()) arqs['requirements.txt'] = v.req;
      const r = await post('/api/arquivo', {acao:'projeto', nome:v.nome, arquivos:arqs}, b); toast(r.msg);
      if(v.venv) prepararPython(r.pasta, !!v.req.trim()); else fecharModal();
    }catch(e){ toast(e.message, true); }
  });
}
async function prepararPython(pasta, comPacotes){
  const r = await executar({ferramenta:'python', acao:'venv', pasta}); if(!r || !comPacotes) return;
  const t = await esperarTarefa(r.tarefa); if(t && t.codigo === 0) executar({ferramenta:'python', acao:'pip', pasta});
}
async function carregarPython(){
  const p = await get('/api/python');
  $('#python').innerHTML = `<p class="sub" style="margin:0 0 12px">${esc(p.versao)}</p>` + (p.projetos.length ? tabela(['Projeto', 'Ambiente', 'Scripts (clique para rodar)', ''], p.projetos.map(x => { const pa = J(x.pasta); return `<tr>
    <td><div class="nome">${esc(x.nome)}</div><div class="sub mono">${esc(curto(x.pasta))}</div></td>
    <td>${x.venv ? st('ok', '.venv pronto') : st('aviso', 'Sem .venv')}${x.requirements ? '<div class="sub">requirements.txt</div>' : ''}</td>
    <td><div class="chips">${x.scripts.map(s => BT(s, `executar({ferramenta:"python",acao:"rodar",pasta:${pa},script:${J(x.pasta + '/' + s)}},this)`, {icone:'play', titulo:'Rodar ' + s})).join('') || '<span class="fraco">nenhum .py</span>'}</div></td>
    <td class="acoes">${x.venv ? BT('Instalar pacote', `pipInstalar(${pa},${x.requirements})`, {icone:'baixar'}) : BT('Criar .venv', `executar({ferramenta:"python",acao:"venv",pasta:${pa}},this)`, {pri:1})}${M([
      x.scripts.some(s => s.startsWith('test_') || s.endsWith('_test.py')) && {t:'Rodar os testes (pytest)', i:'ok', js:`executar({ferramenta:"python",acao:"pytest",pasta:${pa}},this)`},
      x.venv && {t:'Pacotes instalados', i:'logs', js:`executar({ferramenta:"python",acao:"piplist",pasta:${pa}},this)`},
      x.venv && {t:'Salvar requirements.txt', i:'ok', js:`executar({ferramenta:"python",acao:"freeze",pasta:${pa}},this)`}, '-',
      ...x.scripts.map(s => ({t:'Editar ' + s, i:'editar', js:`editarArquivo(${J(x.pasta + '/' + s)})`})), {t:'Novo arquivo .py', i:'novo', js:`novoArquivoPy(${pa})`},
      {t:'Abrir no VS Code', i:'codigo', js:`abrir("vscode",${pa})`}, {t:'Abrir terminal aqui', i:'terminal', js:`abrir("terminal",${pa})`}])}</td></tr>`; }))
    : vazio('Nenhum projeto Python ainda', 'Crie um com o ambiente virtual e os pacotes já instalados.', BT('Novo projeto', 'novoPython()', {pri:1, icone:'novo'})));
}
function novoArquivoPy(pasta){
  const n = prompt('Nome do novo arquivo .py:', 'novo.py'); if(!n) return;
  post('/api/arquivo', {acao:'salvar', caminho:pasta + '/' + n, conteudo:'print("Ola!")\n'}).then(t => { toast(t); editarArquivo(pasta + '/' + n); }).catch(e => toast(e.message, true));
}
function pipInstalar(pasta, temReq){
  abrirModal('Instalar pacote Python', curto(pasta), `<div class="grade-modelos">${['requests','flask','pytest','pandas','fastapi uvicorn'].map(n => `<button class="modelo" onclick='$("#pip-p").value=${A(n)}'><b class="mono">${esc(n)}</b></button>`).join('')}</div>
    <label class="campo" style="margin-top:16px">Pacotes (separados por espaço)${temReq ? '. Vazio instala o requirements.txt' : ''}<input id="pip-p" value="${temReq ? '' : 'requests'}"></label>`,
    [{txt:ico('baixar') + 'Instalar', cls:'pri', fn: b => executar({ferramenta:'python', acao:'pip', pasta, pacotes:$('#pip-p').value}, b)}]);
}

/* ================= ATIVIDADES ================= */
async function carregarAtividades(){
  const t = await get('/api/tarefas');
  $('#atividades').innerHTML = t.tarefas.length ? tabela(['Situação', 'Ferramenta', 'O que rodou', 'Duração', 'Quando'], t.tarefas.map(x => `<tr class="clic" onclick='abrirConsole(${A(x.id)},${A(x.titulo)})'>
      <td>${x.fim ? (x.codigo === 0 ? st('ok', 'Concluído') : st('erro', 'Erro')) : st('aviso', 'Rodando', 1)}</td><td>${etq('', NOME_FERR[x.ferramenta] || x.ferramenta)}</td>
      <td>${esc(x.titulo)}</td><td class="sub">${x.fim ? dur(x.duracao) : '—'}</td><td class="sub">${quando(x.inicio)}</td></tr>`))
    : vazio('Nenhuma atividade ainda', 'Tudo o que você rodar pelo painel (Compose, Terraform, Ansible, pip, Git…) aparece aqui com a saída completa.', '');
}

/* ================= SISTEMA ================= */
async function carregarSistema(){
  const [s, h] = await Promise.all([get('/api/sistema'), get('/api/historico')]); const usoMem = s.mem_total - s.mem_disponivel;
  const pm = Math.round(usoMem*100/s.mem_total), pd = Math.round(s.disco_usado*100/s.disco_total);
  const serv = {docker:['Docker','liga sozinho quando usado','/api/docker'], jenkins:['Jenkins','usa cerca de 500 MB de memória ligado','/api/jenkins']};
  $('#sistema').innerHTML = `<div class="faixa">
      <div><div class="r">Memória</div><div class="n">${mb(usoMem)}</div><div class="d">de ${mb(s.mem_total)}</div><div class="medidor ${pm > 85 ? 'alto' : ''}"><i style="width:${pm}%"></i></div></div>
      <div><div class="r">Disco</div><div class="n">${s.disco_usado} GB</div><div class="d">de ${s.disco_total} GB</div><div class="medidor ${pd > 85 ? 'alto' : ''}"><i style="width:${pd}%"></i></div></div>
      <div><div class="r">Processador</div><div class="n">${h.cpu.length ? h.cpu[h.cpu.length-1] + '%' : '—'}</div><div class="d">${s.cpus} CPUs, carga ${s.carga[0]}</div></div>
      <div><div class="r">Memória comprimida e swap</div><div class="n">${mb(s.swap_total - s.swap_livre)}</div><div class="d">de ${mb(s.swap_total)}</div></div></div>
    <div class="duas">
      <div class="painel"><h3>Processador e memória</h3><div class="corpo-p"><div id="g-sis2"></div><div class="legenda"><span><i style="background:${COR.cpu}"></i>Processador</span><span><i style="background:${COR.mem}"></i>Memória</span></div></div></div>
      <div class="painel"><h3>Serviços</h3>${tabela(['Serviço', 'Situação', ''], [...Object.entries(serv).map(([k, [n, d, api]]) => `<tr><td style="width:55%"><div class="nome">${n}</div><div class="sub">${d}</div></td>
          <td>${s.servicos[k] === 'active' ? st('ok', 'Ligado') : st('', 'Desligado')}</td>
          <td class="acoes">${s.servicos[k] === 'active' ? BT('Desligar', `if(confirm(${J(k === 'docker' ? 'Desligar o Docker? Todos os containers param (os marcados para reiniciar voltam quando o Docker ligar).' : 'Desligar o Jenkins? Libera cerca de 500 MB de memória.')})) acao(${J(api)},{acao:"desligar"},this)`, {icone:'parar'}) : BT('Ligar', `acao(${J(api)},{acao:"ligar"},this)`, {icone:'play', pri:1})}</td></tr>`),
        ...[['NetworkManager','Rede'],['lightdm','Interface gráfica']].map(([k, n]) => `<tr><td class="nome">${n}</td><td>${s.servicos[k] === 'active' ? st('ok', 'Ligado') : st('erro', ({inactive:'Desligado', failed:'Com falha', activating:'Ligando'})[s.servicos[k]] || 'Indisponível')}</td><td></td></tr>`)]).replace('class="t"', 'class="t" style="border:0;border-radius:0"')}</div></div>
    <h2>Portas abertas <span class="sub">IP da VM: ${esc((s.ip||[]).join(', ') || '—')}</span></h2>
    <div class="chips">${(s.portas||[]).map(p => [22,53,631].includes(p.porta) ? etq('', ':' + p.porta + (p.nome ? ' ' + p.nome : '')) : BT(':' + p.porta + (p.nome ? '  ' + p.nome : ''), `abrirUrl("http://localhost:${p.porta}")`, {icone:'abrir', titulo:'Abrir no navegador'})).join('') || '<span class="sub">nenhuma</span>'}</div>
    <h2>Programas que mais usam memória</h2>
    ${tabela(['Programa', 'Usuário', 'Memória', 'CPU', 'Tempo ligado', ''], s.processos.map(p => `<tr><td><span class="nome">${esc(p.nome)}</span> <span class="sub mono">${p.pid}</span></td><td>${esc(p.usuario)}</td>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="medidor" style="width:90px;margin:0"><i style="width:${Math.min(100, p.mem_mb*400/s.mem_total)}%"></i></div>${mb(p.mem_mb)}</div></td><td>${esc(p.cpu)}%</td><td class="mono sub">${esc(p.tempo)}</td>
      <td class="acoes">${p.seu ? BT('Encerrar', `if(confirm("Encerrar " + ${J(p.nome)} + "?")) acao("/api/sistema",{acao:"encerrar",pid:${p.pid}},this)`, {perigo:1}) : ''}</td></tr>`))}`;
  graficoLinha($('#g-sis2'), h.t, [{v:h.cpu, cor:COR.cpu}, {v:h.mem, cor:COR.mem}], [100, s.mem_total]);
}

/* ================= ciclo ================= */
const CARREGAR = {inicio:carregarInicio, docker:carregarDocker, jenkins:carregarJenkins, git:carregarGit, vscode:carregarVscode,
  ansible:carregarAnsible, terraform:carregarTerraform, python:carregarPython, atividades:carregarAtividades, sistema:carregarSistema};
async function carregar(forcar){
  if(ocupado) return;
  if(!forcar && ($('#modal').classList.contains('aberto') || $('#menu-pop') || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))) return;
  ocupado = true;
  try{ await CARREGAR[ABA](); $('#atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR'); }
  catch(e){ $('#atualizado').textContent = 'Erro: ' + e.message; }
  finally{ ocupado = false; }
}
let inicial = 'inicio'; try{ const a = localStorage.getItem('painel-aba'); if(a && CARREGAR[a]) inicial = a; }catch(e){}
irPara(inicial);
atualizarSaude();
setInterval(() => carregar(), 5000);
setInterval(atualizarSaude, 8000);
</script>
