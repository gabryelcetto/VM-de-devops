<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="painel-token" content="__TOKEN__">
<title>Painel DevOps</title>
<style>
:root{
  --fundo:#0d1820; --lado:#0a131a; --cartao:#14232e; --cartao2:#1a2e3c; --borda:#243c4b; --texto:#e6eef2; --fraco:#8fa6b3;
  --acento:#2fc4b2; --acento2:#2f9bd6; --ok:#3ccf7a; --aviso:#f2b84b; --erro:#ef6a6a; --raio:12px;
  --mono:'Ubuntu Mono','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);font:14px/1.45 'Ubuntu','DejaVu Sans',sans-serif}
body{display:flex}
aside{width:210px;flex:none;background:var(--lado);border-right:1px solid var(--borda);display:flex;flex-direction:column;padding:16px 10px;gap:2px;height:100vh;overflow:auto}
aside .logo{font-size:18px;font-weight:700;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
aside .logo span{color:var(--acento)}
aside button{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fraco);padding:9px 12px;border-radius:9px;font:inherit;cursor:pointer;text-align:left}
aside button svg{width:18px;height:18px;flex:none}
aside button:hover{background:var(--cartao);color:var(--texto)}
aside button.ativo{background:var(--acento);color:#04201c;font-weight:700}
aside .sep{height:1px;background:var(--borda);margin:10px 6px}
aside .rodape{margin-top:auto;font-size:11.5px;color:var(--fraco);padding:10px}
#conteudo{flex:1;min-width:0;overflow:auto;height:100vh}
.topo{display:flex;align-items:center;gap:12px;padding:18px 26px 6px;flex-wrap:wrap}
.topo h1{margin:0;font-size:21px}
.topo p{margin:2px 0 0;color:var(--fraco)}
.topo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
main{padding:12px 26px 60px}
section{display:none} section.ativo{display:block}
h2{font-size:15px;margin:22px 0 10px;color:var(--texto);display:flex;align-items:center;gap:8px}
.grade{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grade.kpi{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.grade.dois{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
.cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:var(--raio);padding:14px 16px;min-width:0}
.cartao h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.kpi .cartao{cursor:pointer;transition:border-color .15s, transform .15s}
.kpi .cartao:hover{border-color:var(--acento);transform:translateY(-2px)}
.kpi .rot{color:var(--fraco);font-size:12.5px}
.kpi .num{font-size:28px;font-weight:700;margin-top:4px}
.kpi .det{color:var(--fraco);font-size:12px}
.sub{color:var(--fraco);font-size:12.5px}
.mono{font-family:var(--mono);font-size:13px}
.barra{height:8px;background:#0a131a;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--acento),var(--acento2));border-radius:6px}
.barra.alto i{background:linear-gradient(90deg,var(--aviso),var(--erro))}
.etq{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.etq.ok{background:#173d2a;color:var(--ok)} .etq.erro{background:#432222;color:var(--erro)}
.etq.aviso{background:#43361b;color:var(--aviso)} .etq.neutro{background:#243c4b;color:var(--fraco)} .etq.azul{background:#173750;color:#7cc4f5}
button.b{background:var(--cartao2);color:var(--texto);border:1px solid var(--borda);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.b:hover{border-color:var(--acento)}
button.b.pri{background:var(--acento);color:#04201c;border-color:var(--acento);font-weight:700}
button.b.pri:hover{filter:brightness(1.08)}
button.b.perigo:hover{border-color:var(--erro);color:var(--erro)}
button.b.peq{padding:4px 9px;font-size:12.5px}
button.b:disabled{opacity:.5;cursor:wait}
input,select,textarea{background:#0a131a;color:var(--texto);border:1px solid var(--borda);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
textarea{font-family:var(--mono);min-height:360px;tab-size:2;line-height:1.4;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acento);outline-offset:-1px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--fraco)}
.campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.vazio{color:var(--fraco);padding:26px;text-align:center;background:var(--cartao);border:1px dashed var(--borda);border-radius:var(--raio)}
.vazio b{color:var(--texto);display:block;font-size:15px;margin-bottom:4px}
.aviso-box{background:#2a2614;border:1px solid #5a4a1c;color:#f6dc9a;padding:10px 14px;border-radius:var(--raio);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{background:var(--cartao);border:1px solid var(--borda);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item .cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item .cab b{font-size:15px;overflow:hidden;text-overflow:ellipsis}
.item .linha{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.lista{margin:0;padding:0;list-style:none;max-height:200px;overflow:auto}
.lista li{padding:5px 0;border-bottom:1px solid #1d3341;font-size:13px;display:flex;gap:8px;align-items:center}
.lista li:last-child{border:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.historico{display:flex;gap:3px;align-items:center}
.historico i{width:12px;height:12px;border-radius:3px;display:inline-block;cursor:pointer}
.etapas{display:flex;gap:4px;flex-wrap:wrap}
.etapas span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:#243c4b}
.etapas span.SUCCESS{background:#173d2a;color:var(--ok)} .etapas span.FAILED{background:#432222;color:var(--erro)}
.etapas span.IN_PROGRESS{background:#43361b;color:var(--aviso)}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.modelo{background:var(--cartao2);border:2px solid var(--borda);border-radius:10px;padding:12px;cursor:pointer;text-align:left;color:var(--texto);font:inherit}
.modelo:hover{border-color:var(--acento2)}
.modelo.sel{border-color:var(--acento);background:#173a3a}
.modelo b{display:block;margin-bottom:3px}
.modelo span{color:var(--fraco);font-size:12px}
svg.graf{width:100%;display:block}
svg.graf text{fill:var(--fraco);font-size:11px;font-family:inherit}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--fraco);flex-wrap:wrap;margin-top:6px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--borda);vertical-align:middle}
th{color:var(--fraco);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:0}
.atv{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #1d3341;cursor:pointer;border-radius:6px}
.atv:hover{background:#172935}
.atv:last-child{border:0}
.atv .tit{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ferr{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--cartao2);border-radius:8px;min-width:0}
.ponto{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--fraco);flex:none}
.ponto.ok{background:var(--ok)} .ponto.erro{background:var(--erro)} .ponto.aviso{background:var(--aviso)}
.chave{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1d3341}
.chave:last-child{border:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal.aberto{display:flex}
#modal .caixa{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;width:min(1100px,100%);max-height:92vh;display:flex;flex-direction:column}
#modal .mcab{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--borda);gap:10px}
#modal .mcab b{font-size:16px}
#modal .corpo{padding:16px 18px;overflow:auto}
#modal pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13px;background:#071016;padding:12px;border-radius:8px;min-height:200px;max-height:62vh;overflow:auto}
#modal .rod{padding:12px 18px;border-top:1px solid var(--borda);display:flex;gap:8px;justify-content:flex-end;align-items:center}
#avisos{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:460px}
.toast{background:var(--cartao2);border:1px solid var(--borda);border-left:4px solid var(--acento);padding:10px 14px;border-radius:8px;white-space:pre-wrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.toast.erro{border-left-color:var(--erro)}
.girando{display:inline-block;width:12px;height:12px;border:2px solid var(--aviso);border-right-color:transparent;border-radius:50%;animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
@media (max-width:900px){aside{width:64px} aside button span, aside .logo span, aside .rodape{display:none} .grade.dois{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside id="menu">
  <div class="logo">∞ <span>Painel DevOps</span></div>
  <button data-aba="inicio" class="ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Início</span></button>
  <div class="sep"></div>
  <button data-aba="docker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="5" height="4"/><rect x="8" y="10" width="5" height="4"/><rect x="13" y="10" width="5" height="4"/><rect x="8" y="6" width="5" height="4"/><path d="M2 14h19c-1 4-5 6-10 6S3 18 2 14z"/></svg><span>Docker</span></button>
  <button data-aba="jenkins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="2.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M7.5 12h2M14.5 12h2"/></svg><span>Jenkins</span></button>
  <button data-aba="git"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 7.5v9M18 11.5c0 4-6 3-11.5 6"/></svg><span>Git</span></button>
  <button data-aba="vscode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3l4 2v14l-4 2L7 13l-4 3-1-1V9l1-1 4 3L17 3zM17 8l-5 4 5 4z"/></svg><span>VS Code</span></button>
  <button data-aba="ansible"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 17l4-10 4 10M10 13l5 2.5"/></svg><span>Ansible</span></button>
  <button data-aba="terraform"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4l5 3v6L3 10zM9.5 7.5l5 3v6l-5-3zM16 10.5l5-3v6l-5 3zM9.5 15l5 3v4l-5-3z"/></svg><span>Terraform</span></button>
  <button data-aba="python"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c-4 0-4 1.5-4 3v2h4.5v1H6c-2 0-3 1.5-3 4s1 4 3 4h1.5v-2.5c0-1.5 1-2.5 2.5-2.5h4.5c1.5 0 2.5-1 2.5-2.5V6c0-1.5-1-3-5-3z"/><path d="M12 21c4 0 4-1.5 4-3v-2h-4.5v-1H18c2 0 3-1.5 3-4"/></svg><span>Python</span></button>
  <div class="sep"></div>
  <button data-aba="atividades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="17" r="3"/></svg><span>Atividades</span></button>
  <button data-aba="sistema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M6 12l3-3 3 2 4-4"/></svg><span>Sistema</span></button>
  <div class="rodape" id="atualizado">—</div>
</aside>

<div id="conteudo">
  <div class="topo"><div><h1 id="titulo">Início</h1><p id="descricao"></p></div><div class="acoes" id="acoes-topo"></div></div>
  <main>
    <section id="inicio" class="ativo">
      <div class="grade kpi" id="kpis"></div>
      <div class="grade dois" style="margin-top:14px">
        <div class="cartao"><h3>Processador e memória (ao vivo)</h3><div id="g-sis"></div><div class="legenda"><span><i style="background:var(--acento2)"></i>CPU %</span><span><i style="background:var(--acento)"></i>Memória usada</span></div></div>
        <div class="cartao"><h3>Builds do Jenkins</h3><div id="g-builds"></div></div>
        <div class="cartao"><h3>Containers</h3><div id="g-cont"></div></div>
        <div class="cartao"><h3>Commits por dia (14 dias)</h3><div id="g-commits"></div></div>
      </div>
      <div class="grade dois" style="margin-top:14px">
        <div class="cartao"><h3>Atividade recente</h3><div id="atividade-inicio"></div></div>
        <div class="cartao"><h3>Ferramentas instaladas</h3><div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px" id="ferramentas"><div class="sub">Conferindo versões…</div></div></div>
      </div>
    </section>
    <section id="docker"></section>
    <section id="jenkins"></section>
    <section id="git"></section>
    <section id="vscode"></section>
    <section id="ansible"></section>
    <section id="terraform"></section>
    <section id="python"></section>
    <section id="atividades"></section>
    <section id="sistema"></section>
  </main>
</div>

<div id="modal"><div class="caixa">
  <div class="mcab"><b id="m-titulo"></b><span class="sub" id="m-sub"></span><button class="b" style="margin-left:auto" onclick="fecharModal()">Fechar ✕</button></div>
  <div class="corpo" id="m-corpo"></div>
  <div class="rod" id="m-rod"></div>
</div></div>
<div id="avisos"></div>

<script>
const TOKEN = document.querySelector('meta[name="painel-token"]').content;
let ABA = 'inicio', ocupado = false, DADOS = {};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A = v => esc(JSON.stringify(v));
const mb = n => n >= 1024 ? (n/1024).toFixed(1) + ' GB' : Math.round(n) + ' MB';
const quando = ms => { if(!ms) return ''; const s = (Date.now()-ms)/1000; return s < 60 ? 'agora' : s < 3600 ? Math.round(s/60)+' min atrás' : s < 86400 ? Math.round(s/3600)+' h atrás' : new Date(ms).toLocaleDateString('pt-BR'); };
const dur = ms => !ms ? '' : ms < 1000 ? ms + ' ms' : ms < 60000 ? (ms/1000).toFixed(1) + ' s' : Math.floor(ms/60000) + ' min ' + Math.round(ms%60000/1000) + ' s';
const base = c => c.split('/').pop();
const pai = c => c.replace(/\/[^/]+$/, '');

/* ================= comunicação ================= */
function toast(msg, erro){ const d = document.createElement('div'); d.className = 'toast' + (erro ? ' erro' : ''); d.textContent = msg; $('#avisos').appendChild(d); setTimeout(() => d.remove(), erro ? 9000 : 4500); }
async function get(url){ const r = await fetch(url); const j = await r.json(); if(!r.ok) throw new Error(j.erro || r.statusText); return j; }
async function post(url, dados, btn){
  if(btn) btn.disabled = true;
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json','X-Painel-Token':TOKEN}, body:JSON.stringify(dados)});
    const j = await r.json(); if(!r.ok) throw new Error(j.erro || r.statusText); return j.resultado;
  } finally { if(btn) btn.disabled = false; }
}
async function acao(url, dados, btn, titulo){
  try{
    const res = await post(url, dados, btn);
    if(titulo) modalTexto(titulo, typeof res === 'string' ? res : JSON.stringify(res, null, 2));
    else toast(typeof res === 'string' ? res.slice(-600) : (res && res.msg) || 'Feito.');
    carregar(true); return res;
  }catch(e){ toast(e.message, true); }
}
async function executar(dados, btn){
  try{ const r = await post('/api/executar', dados, btn); abrirConsole(r.tarefa, r.titulo); return r; }
  catch(e){ toast(e.message, true); }
}
function abrir(tipo, caminho, extra){ acao('/api/abrir', {acao:tipo, caminho, ...(extra||{})}); }
function abrirUrl(url){ acao('/api/abrir', {acao:'url', url}); }

/* ================= janelas ================= */
let consoleTimer = null;
function abrirModal(titulo, sub, html, botoes){
  clearTimeout(consoleTimer);
  $('#m-titulo').textContent = titulo; $('#m-sub').textContent = sub || '';
  $('#m-corpo').innerHTML = html; $('#m-rod').innerHTML = '';
  (botoes || []).forEach(b => { const e = document.createElement('button'); e.className = 'b ' + (b.cls||''); e.innerHTML = b.txt; e.onclick = () => b.fn(e); $('#m-rod').appendChild(e); });
  $('#modal').classList.add('aberto');
}
function fecharModal(){ clearTimeout(consoleTimer); $('#modal').classList.remove('aberto'); carregar(true); }
function modalTexto(titulo, texto){ abrirModal(titulo, '', '<pre>' + esc(texto) + '</pre>'); const p = $('#m-corpo pre'); p.scrollTop = p.scrollHeight; }
function modalEditor(titulo, sub, texto, botoes){
  abrirModal(titulo, sub, '<textarea id="m-edit" spellcheck="false"></textarea>', botoes);
  const t = $('#m-edit'); t.value = texto; t.focus();
  t.addEventListener('keydown', e => { if(e.key === 'Tab'){ e.preventDefault(); t.setRangeText('  ', t.selectionStart, t.selectionEnd, 'end'); } });
}
function abrirConsole(id, titulo){
  abrirModal(titulo, 'saída ao vivo', '<div id="c-estado" style="margin-bottom:8px"></div><pre id="c-saida"></pre>',
    [{txt:'■ Parar', cls:'perigo', fn: b => post('/api/tarefa-parar', {id}, b).then(toast).catch(e => toast(e.message, true))}]);
  let desde = 0;
  const passo = async () => {
    try{
      const t = await get('/api/tarefa?id=' + id + '&desde=' + desde);
      const pre = $('#c-saida'); if(!pre) return;
      const noFim = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
      if(t.linhas.length){ pre.textContent += t.linhas.join('\n') + '\n'; desde = t.total; if(noFim) pre.scrollTop = pre.scrollHeight; }
      $('#c-estado').innerHTML = t.fim
        ? (t.codigo === 0 ? '<span class="etq ok">✔ concluído</span>' : `<span class="etq erro">✖ terminou com erro (código ${t.codigo})</span>`) + ` <span class="sub">${dur(t.duracao)} · <span class="mono">${esc(t.comando)}</span></span>`
        : `<span class="girando"></span> <span class="sub">rodando… <span class="mono">${esc(t.comando)}</span></span>`;
      if(!t.fim) consoleTimer = setTimeout(passo, 700);
    }catch(e){ if($('#c-estado')) $('#c-estado').textContent = e.message; }
  };
  passo();
}
function esperarTarefa(id){ return new Promise(res => { const v = async () => { try{ const t = await get('/api/tarefa?id=' + id); if(t.fim) return res(t); }catch(e){ return res(null); } setTimeout(v, 800); }; v(); }); }
/* criação com modelos clicáveis */
function assistente(titulo, modelos, campos, aoCriar, rotulo){
  let sel = 0;
  abrirModal(titulo, '', `<div class="sub" style="margin-bottom:8px">1. Escolha um modelo</div><div class="modelos">${modelos.map((m,i) => `<button class="modelo${i?'':' sel'}" data-i="${i}"><b>${esc(m.nome)}</b><span>${esc(m.desc)}</span></button>`).join('')}</div>
    <div class="sub" style="margin:16px 0 0">2. Ajuste se quiser e clique em <b>${esc(rotulo || 'Criar')}</b></div><div class="campos" id="a-campos"></div>`,
    [{txt: rotulo || 'Criar', cls:'pri', fn: async b => {
      const v = {}; campos.forEach(c => { const e = document.getElementById('a-' + c.id); if(e) v[c.id] = c.tipo === 'check' ? e.checked : e.value; });
      await aoCriar(v, modelos[sel], b);
    }}]);
  const desenhar = () => {
    const m = modelos[sel];
    $('#a-campos').innerHTML = campos.filter(c => !c.so || c.so(m)).map(c => {

/* ================= gráficos ================= */
function graficoLinha(el, t, series, maxes){
  const W = 600, H = 170, P = 34;
  if(t.length < 2){ el.innerHTML = '<div class="sub" style="padding:30px 0;text-align:center">Coletando dados… o gráfico aparece em alguns segundos.</div>'; return; }
  const x = i => P + (W - P - 8) * i / (t.length - 1);
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  [0, .5, 1].forEach(f => { const y = 8 + (H - 30) * (1 - f); svg += `<line x1="${P}" x2="${W-8}" y1="${y}" y2="${y}" stroke="#243c4b"/><text x="2" y="${y+4}">${Math.round(f*100)}%</text>`; });
  series.forEach((s, k) => {
    const pts = s.v.map((v, i) => `${x(i).toFixed(1)},${(8 + (H-30) * (1 - Math.min(v, maxes[k]) / maxes[k])).toFixed(1)}`).join(' ');
    svg += `<polygon points="${P},${H-22} ${pts} ${x(s.v.length-1).toFixed(1)},${H-22}" fill="${s.cor}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${s.cor}" stroke-width="2.2" stroke-linejoin="round"/>`;
  });
  const hm = ms => new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  el.innerHTML = svg + `<text x="${P}" y="${H-4}">${hm(t[0])}</text><text x="${W-42}" y="${H-4}">${hm(t[t.length-1])}</text></svg>`;
}
function graficoRosca(el, partes){
  const total = partes.reduce((a, p) => a + p.v, 0);
  if(!total){ el.innerHTML = vazio('Nenhum container ainda', '', `<button class="b pri" onclick="irPara('docker');novoContainer()">+ Criar o primeiro</button>`); return; }
  let ang = -Math.PI/2, svg = `<svg class="graf" viewBox="0 0 330 150" style="max-width:440px">`;
  const R = 62, r = 38, cx = 75, cy = 75, P = (a, rr) => `${(cx + rr*Math.cos(a)).toFixed(2)},${(cy + rr*Math.sin(a)).toFixed(2)}`;
  partes.filter(p => p.v).forEach(p => {
    const a2 = ang + 2*Math.PI * p.v / total, g = a2 - ang > Math.PI ? 1 : 0;
    svg += p.v === total ? `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p.cor}" stroke-width="${R-r}"/>`
      : `<path d="M${P(ang,R)} A${R},${R} 0 ${g} 1 ${P(a2,R)} L${P(a2,r)} A${r},${r} 0 ${g} 0 ${P(ang,r)}Z" fill="${p.cor}"/>`;
    ang = a2;
  });
  svg += `<text x="${cx}" y="${cy+8}" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#e6eef2">${total}</text>`;
  partes.forEach((p, i) => svg += `<rect x="175" y="${32+i*26}" width="12" height="12" rx="3" fill="${p.cor}"/><text x="194" y="${43+i*26}" style="font-size:13px;fill:#e6eef2">${esc(p.n)}: ${p.v}</text>`);
  el.innerHTML = svg + '</svg>';
}
function graficoBarras(el, itens, cor){
  const W = 600, H = 160, max = Math.max(1, ...itens.map(i => i.v)), bw = (W - 20) / itens.length;
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  itens.forEach((it, i) => { const h = (H - 36) * it.v / max, x = 10 + i*bw;
    svg += `<rect x="${(x+3).toFixed(1)}" y="${(H-22-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${Math.max(h, 2).toFixed(1)}" rx="3" fill="${it.v ? cor : '#243c4b'}"><title>${esc(it.r)}: ${it.v}</title></rect>`;
    if(it.v) svg += `<text x="${(x+bw/2).toFixed(1)}" y="${(H-26-h).toFixed(1)}" text-anchor="middle">${it.v}</text>`;
    if(i % 2 === 0) svg += `<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(it.r)}</text>`; });
  el.innerHTML = svg + '</svg>';
}
const COR_BUILD = r => ({SUCCESS:'#3ccf7a', FAILURE:'#ef6a6a', UNSTABLE:'#f2b84b', ABORTED:'#8fa6b3', 'EM ANDAMENTO':'#2f9bd6'})[r] || '#5b7280';
function graficoBuilds(el, builds){
  if(!builds.length){ el.innerHTML = vazio('Nenhum build ainda', '', `<button class="b pri" onclick="irPara('jenkins');novoPipeline()">+ Criar um pipeline</button>`); return; }
  const W = 600, H = 160, max = Math.max(1000, ...builds.map(b => b.d || 0)), bw = (W - 20) / Math.max(builds.length, 12);
  let svg = `<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  builds.forEach((b, i) => { const h = Math.max(6, (H - 34) * (b.d || 0) / max), x = 10 + i*bw;
    svg += `<rect x="${(x+2).toFixed(1)}" y="${(H-22-h).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${COR_BUILD(b.r)}" style="cursor:pointer" onclick='acao("/api/jenkins",{acao:"console",job:${A(b.job)},numero:${b.n}},null,${A(b.job + " #" + b.n)})'><title>${esc(b.job)} #${b.n} — ${esc(b.r||'')} — ${dur(b.d)}</title></rect>`; });
  el.innerHTML = svg + `<text x="10" y="${H-6}">mais antigos</text><text x="${W-90}" y="${H-6}">mais recentes</text></svg><div class="legenda"><span><i style="background:#3ccf7a"></i>sucesso</span><span><i style="background:#ef6a6a"></i>falha</span><span><i style="background:#2f9bd6"></i>rodando</span><span>altura = duração · clique para ver o console</span></div>`;
}

  $('#kpis').innerHTML =
    k('docker', 'Docker', r.docker.ligado ? `${r.docker.rodando}/${r.docker.total}` : '—', r.docker.ligado ? `containers rodando · ${r.docker.imagens} imagens` : 'desligado (liga ao usar)') +
    k('jenkins', 'Jenkins', r.jenkins.respondendo ? r.jenkins.jobs : '—', r.jenkins.respondendo ? `pipelines · ${r.jenkins.sucessos} ok · ${r.jenkins.falhas} falhando` : (r.jenkins.servico === 'active' ? 'ligando…' : 'desligado')) +

    k('sistema', 'Memória', mb(usoMem), `de ${mb(s.mem_total)} · disco ${s.disco_usado}/${s.disco_total} GB`);
  graficoLinha($('#g-sis'), r.historico.t, [{v:r.historico.cpu, cor:'#2f9bd6'}, {v:r.historico.mem, cor:'#2fc4b2'}], [100, s.mem_total]);
  graficoBuilds($('#g-builds'), r.builds);
  const e = r.docker.estados || {};
  graficoRosca($('#g-cont'), [{n:'rodando', v:e.running||0, cor:'#3ccf7a'}, {n:'parados', v:(e.exited||0)+(e.created||0), cor:'#8fa6b3'}, {n:'outros', v:(e.paused||0)+(e.restarting||0)+(e.dead||0), cor:'#f2b84b'}]);

/* ================= JENKINS ================= */
const MODELOS_PIPELINE = [
  {nome:'Olá Jenkins', desc:'Pipeline mínimo com 2 etapas', valores:{nome:'ola-jenkins', script:`pipeline {\n  agent any\n  stages {\n    stage('Ola') {\n      steps {\n        echo 'Ola do Jenkins!'\n      }\n    }\n    stage('Informacoes') {\n      steps {\n        sh 'date && hostname && whoami'\n      }\n    }\n  }\n}\n`}},
  {nome:'Container Docker (1 GB)', desc:'Container com limite de memória', valores:{nome:'container-docker', script:`pipeline {\n  agent any\n  stages {\n    stage('Rodar container') {\n      steps {\n        sh 'docker run --rm --memory=1g --memory-swap=1g hello-world'\n      }\n    }\n    stage('Conferir limite') {\n      steps {\n        sh 'docker run --rm --memory=1g --memory-swap=1g alpine cat /sys/fs/cgroup/memory.max'\n      }\n    }\n  }\n}\n`}},
  {nome:'Subir Docker Compose', desc:'Sobe um docker-compose.yml', valores:{nome:'subir-compose', compose:'/opt/aula/docker-compose.yml'}},
  {nome:'Código do GitHub', desc:'Clona um repositório e roda', valores:{nome:'meu-repo', repo:'https://github.com/usuario/repositorio.git', branch:'main'}},
  {nome:'Testes Python', desc:'Roda num container Python', valores:{nome:'testes-python', script:`pipeline {\n  agent { docker { image 'python:3.12-slim' } }\n  stages {\n    stage('Versao') {\n      steps { sh 'python --version' }\n    }\n    stage('Teste') {\n      steps { sh 'python -c "assert 1 + 1 == 2; print(123)"' }\n    }\n  }\n}\n`}},
  {nome:'Em branco', desc:'Escreva do zero', valores:{nome:'meu-pipeline', script:`pipeline {\n  agent any\n  stages {\n    stage('Etapa 1') {\n      steps {\n        sh 'echo trocar este comando'\n      }\n    }\n  }\n}\n`}},
];
const scriptCompose = c => `pipeline {\n  agent any\n  stages {\n    stage('Subir com Compose') {\n      steps {\n        sh 'docker compose -f ${c} up -d'\n      }\n    }\n    stage('Conferir') {\n      steps {\n        sh 'docker compose -f ${c} ps'\n      }\n    }\n  }\n}\n`;
const scriptGit = (r, b) => `pipeline {\n  agent any\n  stages {\n    stage('Baixar codigo') {\n      steps {\n        // repositorio privado: acrescente , credentialsId: 'github'\n        git branch: '${b}', url: '${r}'\n      }\n    }\n    stage('Listar arquivos') {\n      steps {\n        sh 'ls -la'\n      }\n    }\n  }\n}\n`;
function novoPipeline(){
  assistente('Novo pipeline no Jenkins', MODELOS_PIPELINE, [
    {id:'nome', rot:'Nome do pipeline'},
    {id:'compose', rot:'Caminho do docker-compose.yml', so: m => m.valores.compose !== undefined},
    {id:'repo', rot:'URL do repositório', so: m => m.valores.repo !== undefined}, {id:'branch', rot:'Branch', so: m => m.valores.repo !== undefined},
    {id:'script', rot:'Script (Jenkinsfile)', tipo:'area', alt:240, so: m => m.valores.script !== undefined},
    {id:'construir', rot:'Construir logo depois de criar', tipo:'check', padrao:true},
  ], async (v, m, b) => {
    let script = v.script;
    if(m.valores.compose !== undefined) script = scriptCompose(v.compose);
    if(m.valores.repo !== undefined) script = scriptGit(v.repo, v.branch || 'main');
    try{
      toast(await post('/api/jenkins', {acao:'criar', job:v.nome, script}, b));
      if(v.construir){ await post('/api/jenkins', {acao:'construir', job:v.nome}, b); acompanharBuild(v.nome); } else fecharModal();
    }catch(e){ toast(e.message, true); }
  });
}
function acompanharBuild(job){
  abrirModal('Build: ' + job, 'acompanhando ao vivo', '<div id="b-etapas" class="etapas" style="margin-bottom:10px"></div><pre id="b-saida">Aguardando o Jenkins começar…</pre>',
    [{txt:'Abrir no Jenkins', fn: () => abrirUrl('http://localhost:8080/job/' + encodeURIComponent(job) + '/')}]);
  const passo = async () => {
    if(!$('#b-saida')) return;
    const [txt, et] = await Promise.all([post('/api/jenkins', {acao:'console', job}).catch(() => null), post('/api/jenkins', {acao:'etapas', job}).catch(() => null)]);
    if(!$('#b-saida')) return;
    if(txt){ const p = $('#b-saida'); p.textContent = txt; p.scrollTop = p.scrollHeight; }
    if(et) $('#b-etapas').innerHTML = (et.etapas||[]).map(s => `<span class="${esc(s.status)}">${esc(s.nome)}${s.duracao ? ' · ' + dur(s.duracao) : ''}</span>`).join('');
    if(txt && /Finished: (SUCCESS|FAILURE|ABORTED|UNSTABLE)/.test(txt)){ const ok = txt.includes('Finished: SUCCESS'); toast(ok ? 'Build concluído com sucesso ✔' : 'O build falhou — veja a saída.', !ok); $('#m-sub').textContent = ok ? 'concluído com sucesso' : 'falhou'; return; }
    consoleTimer = setTimeout(passo, 1500);
  };
  consoleTimer = setTimeout(passo, 1500);
}
async function carregarJenkins(){
  const j = await get('/api/jenkins'); const el = $('#jenkins');
  if(!j.respondendo){
    el.innerHTML = j.servico === 'active' ? `<div class="aviso-box"><span class="girando"></span> O Jenkins está ligando (cerca de 1 minuto). Esta página atualiza sozinha.</div>`
      : `<div class="aviso-box">O Jenkins está desligado. <button class="b pri" onclick="acao('/api/jenkins',{acao:'ligar'},this)">▶ Ligar o Jenkins</button></div>`;
    return;
  }
  const res = r => !r ? etq('neutro','nunca rodou') : r === 'SUCCESS' ? etq('ok','sucesso') : r === 'FAILURE' ? etq('erro','falhou') : r === 'EM ANDAMENTO' ? '<span class="etq aviso">rodando…</span>' : etq('aviso', r);
  const idEt = n => 'et-' + n.replace(/[^a-z0-9]/gi, '_');
  el.innerHTML = `<div class="sub" style="margin-bottom:12px"><span class="ponto ok"></span> Jenkins ligado · usuário aluno / senha devops · <button class="b peq" onclick="if(confirm('Desligar o Jenkins? Libera uns 500 MB de memória.')) acao('/api/jenkins',{acao:'desligar'},this)">Desligar</button></div>
    ${j.jobs.length ? `<div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${j.jobs.map(x => `<div class="item">
      <div class="cab"><b>${esc(x.nome)}</b>${res(x.resultado)}</div>
      <div class="sub">${esc(x.tipo.replace('WorkflowJob','Pipeline').replace('FreeStyleProject','Freestyle'))}${x.ultimo ? ` · último #${x.ultimo} ${quando(x.quando)} · ${dur(x.duracao)}` : ''}</div>
      ${x.historico.length ? `<div class="historico" title="últimos builds — clique para ver">${x.historico.slice().reverse().map(b => `<i style="background:${COR_BUILD(b.r)}" title="#${b.n} ${esc(b.r||'')} ${dur(b.d)}" onclick='acao("/api/jenkins",{acao:"console",job:${A(x.nome)},numero:${b.n}},null,${A(x.nome + " #" + b.n)})'></i>`).join('')}</div>` : ''}
      <div class="etapas" id="${idEt(x.nome)}"></div>
      <div class="linha"><button class="b peq pri" onclick='jkConstruir(${A(x.nome)},this)'>▶ Construir</button>
        ${x.ultimo ? `<button class="b peq" onclick='acao("/api/jenkins",{acao:"console",job:${A(x.nome)}},this,"Console — "+${A(x.nome)})'>Console</button>` : ''}
        ${x.tipo === 'WorkflowJob' ? `<button class="b peq" onclick='jkEditar(${A(x.nome)},this)'>✎ Editar script</button>` : ''}
        <button class="b peq" onclick='abrirUrl(${A(x.url.replace(/^https?:\/\/[^/]+/, "http://localhost:8080"))})'>Abrir</button>
        <button class="b peq perigo" onclick='if(confirm("Apagar o pipeline "+${A(x.nome)}+"?")) acao("/api/jenkins",{acao:"apagar",job:${A(x.nome)}},this)'>Apagar</button></div></div>`).join('')}</div>`
      : vazio('Nenhum pipeline ainda', 'Crie um a partir de um modelo: Docker com limite de 1 GB, Compose, GitHub, testes…', '<button class="b pri" onclick="novoPipeline()">+ Novo pipeline</button>')}`;
  j.jobs.filter(x => x.tipo === 'WorkflowJob' && x.ultimo).forEach(async x => {
    try{ const et = await post('/api/jenkins', {acao:'etapas', job:x.nome}); const alvo = document.getElementById(idEt(x.nome));
      if(alvo) alvo.innerHTML = (et.etapas||[]).map(s => `<span class="${esc(s.status)}">${esc(s.nome)}</span>`).join(''); }catch(e){}
  });
}

const GITIGNORE = {Python:'__pycache__/\n.venv/\n*.pyc\n.env\n', Node:'node_modules/\n.env\n', Terraform:'.terraform/\n*.tfstate\n*.tfstate.*\n', Nenhum:''};
function novoRepo(){
  assistente('Novo repositório Git', [
    {nome:'Projeto Python', desc:'README + .gitignore de Python', valores:{nome:'meu-projeto', tipo:'Python'}},
    {nome:'Projeto Terraform', desc:'Ignora estado e .terraform', valores:{nome:'minha-infra', tipo:'Terraform'}},
    {nome:'Projeto Node', desc:'Ignora node_modules', valores:{nome:'meu-app', tipo:'Node'}},
    {nome:'Simples', desc:'Só um README', valores:{nome:'meu-repo', tipo:'Nenhum'}},
  ], [{id:'nome', rot:'Nome (pasta em ~/projetos)'}, {id:'tipo', rot:'.gitignore', tipo:'select', opcoes: () => Object.keys(GITIGNORE)}, {id:'vscode', rot:'Abrir no VS Code depois', tipo:'check', padrao:true}],
  async (v, m, b) => {
    try{
      const arqs = {'README.md': `# ${v.nome}\n\nProjeto criado no DevOps-Lab.\n`}; if(GITIGNORE[v.tipo]) arqs['.gitignore'] = GITIGNORE[v.tipo];
      const r = await post('/api/arquivo', {acao:'projeto', nome:v.nome, arquivos:arqs, git:true}, b);
      toast(r.msg); fecharModal(); if(v.vscode) abrir('vscode', r.pasta);
    }catch(e){ toast(e.message, true); }
  });
}

async function carregarGit(){

    : `<div class="aviso-box">Antes do primeiro commit, diga ao Git seu nome e e-mail. <button class="b pri" onclick="gitIdent()">Configurar agora</button></div>`;
  $('#git').innerHTML = ident + (g.repos.length ? `<div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${g.repos.map((r, i) => `<div class="item">
    <div class="cab"><b>${esc(r.nome)}</b>${etq('azul', '⎇ ' + r.branch)}${r.mudancas.length ? etq('aviso', r.mudancas.length + ' mudança(s)') : etq('ok','tudo salvo')}${r.sincronia ? etq('neutro', r.sincronia) : ''}</div>

    <div class="linha">

      <button class="b peq" onclick="gitBranch(${i})">⎇ Branches</button>
      ${r.remoto ? `<button class="b peq" onclick='executar({ferramenta:"git",acao:"pull",repo:${A(r.caminho)}},this)'>⬇ Pull</button><button class="b peq" onclick='executar({ferramenta:"git",acao:"push",repo:${A(r.caminho)}},this)'>⬆ Push</button>` : ''}
      <button class="b peq" onclick='abrir("vscode",${A(r.caminho)})'>VS Code</button><button class="b peq" onclick='abrir("terminal",${A(r.caminho)})'>Terminal</button>

function gitCommit(i){
  const r = DADOS.git.repos[i];
  const tipo = c => c.includes('?') ? ['ok','novo'] : c.includes('D') ? ['erro','apagado'] : ['aviso','alterado'];
  abrirModal('Commit em ' + r.nome, 'branch ' + r.branch, `<div class="sub" style="margin-bottom:6px">Marque os arquivos que entram no commit:</div>
    <div style="max-height:260px;overflow:auto;background:#0a131a;border-radius:8px;padding:8px 12px">${r.mudancas.map(m => { const [c, t] = tipo(m.codigo);
      return `<label style="display:flex;gap:8px;align-items:center;padding:4px 0" class="mono"><input type="checkbox" checked data-arq="${esc(m.arquivo.replace(/^"|"$/g,'').split(' -> ').pop())}" style="width:auto">${etq(c, t)} ${esc(m.arquivo)}</label>`; }).join('')}</div>
    <label class="campo" style="margin-top:12px">Mensagem do commit<input id="c-msg" placeholder="ex.: adiciona página inicial"></label>`,
    [{txt:'✔ Fazer commit', cls:'pri', fn: async b => {
      const arquivos = [...document.querySelectorAll('[data-arq]')].filter(x => x.checked).map(x => x.dataset.arq);
      if(!arquivos.length) return toast('Marque pelo menos um arquivo.', true);
      try{ toast(await post('/api/git', {acao:'commit', repo:r.caminho, mensagem:$('#c-msg').value, arquivos}, b)); fecharModal(); }catch(e){ toast(e.message, true); }
    }}]);
  setTimeout(() => $('#c-msg').focus(), 50);
}
function gitBranch(i){
  const r = DADOS.git.repos[i];
  abrirModal('Branches de ' + r.nome, 'atual: ' + r.branch, `<div class="sub" style="margin-bottom:8px">Clique para trocar:</div><div class="chips">${r.branches.map(b => `<button class="b ${b === r.branch ? 'pri' : ''}" onclick='trocarBranch(${A(r.caminho)},${A(b)},this)'>⎇ ${esc(b)}</button>`).join('') || '<span class="sub">faça o primeiro commit para criar a branch</span>'}</div>
    <label class="campo" style="margin-top:16px">Ou crie uma nova (ex.: feature/login)<input id="nova-branch" placeholder="feature/minha-tarefa"></label>`,

async function carregarSistema(){
  const [s, h] = await Promise.all([get('/api/sistema'), get('/api/historico')]); const usoMem = s.mem_total - s.mem_disponivel;
  const pm = Math.round(usoMem*100/s.mem_total), pd = Math.round(s.disco_usado*100/s.disco_total);
  const serv = {docker:['Docker','liga sozinho quando usado','/api/docker'], jenkins:['Jenkins','usa ~500 MB de memória ligado','/api/jenkins']};
  $('#sistema').innerHTML = `<div class="grade kpi">
      <div class="cartao"><div class="rot">Memória</div><div class="num">${mb(usoMem)}</div><div class="det">de ${mb(s.mem_total)}</div><div class="barra ${pm > 85 ? 'alto' : ''}"><i style="width:${pm}%"></i></div></div>
      <div class="cartao"><div class="rot">Disco</div><div class="num">${s.disco_usado} GB</div><div class="det">de ${s.disco_total} GB</div><div class="barra ${pd > 85 ? 'alto' : ''}"><i style="width:${pd}%"></i></div></div>
      <div class="cartao"><div class="rot">Processador</div><div class="num">${h.cpu.length ? h.cpu[h.cpu.length-1] + '%' : '—'}</div><div class="det">${s.cpus} CPUs · carga ${s.carga[0]}</div></div>
      <div class="cartao"><div class="rot">Swap</div><div class="num">${mb(s.swap_total - s.swap_livre)}</div><div class="det">de ${mb(s.swap_total)}</div></div></div>
    <div class="grade dois" style="margin-top:14px">
      <div class="cartao"><h3>Processador e memória (ao vivo)</h3><div id="g-sis2"></div><div class="legenda"><span><i style="background:var(--acento2)"></i>CPU %</span><span><i style="background:var(--acento)"></i>Memória</span></div></div>
      <div class="cartao"><h3>Serviços</h3>${Object.entries(serv).map(([k, [n, d, api]]) => `<div class="chave"><div><span class="ponto ${s.servicos[k] === 'active' ? 'ok' : 'erro'}"></span> <b>${n}</b> <span class="sub">${s.servicos[k] === 'active' ? 'ligado' : 'desligado'} · ${d}</span></div>
        ${s.servicos[k] === 'active' ? `<button class="b peq" onclick="acao('${api}',{acao:'desligar'},this)">■ Desligar</button>` : `<button class="b peq pri" onclick="acao('${api}',{acao:'ligar'},this)">▶ Ligar</button>`}</div>`).join('')}
        ${[['NetworkManager','Rede'],['lightdm','Interface gráfica']].map(([k, n]) => `<div class="chave"><div><span class="ponto ${s.servicos[k] === 'active' ? 'ok' : 'erro'}"></span> <b>${n}</b> <span class="sub">${s.servicos[k] === 'active' ? 'ligado' : esc(s.servicos[k])}</span></div></div>`).join('')}</div></div>
    <h2>Programas que mais usam memória</h2>
    <div class="cartao"><table><tr><th>Programa</th><th>Usuário</th><th>Memória</th><th>CPU</th><th>Tempo</th><th></th></tr>
      ${s.processos.map(p => `<tr><td><b>${esc(p.nome)}</b> <span class="sub mono">${p.pid}</span></td><td>${esc(p.usuario)}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="barra" style="width:90px;margin:0"><i style="width:${Math.min(100, p.mem_mb*400/s.mem_total)}%"></i></div>${mb(p.mem_mb)}</div></td><td>${esc(p.cpu)}%</td><td class="mono">${esc(p.tempo)}</td>
        <td style="text-align:right">${p.seu ? `<button class="b peq perigo" onclick='if(confirm("Encerrar "+${A(p.nome)}+"?")) acao("/api/sistema",{acao:"encerrar",pid:${p.pid}},this)'>Encerrar</button>` : ''}</td></tr>`).join('')}</table></div>`;
  graficoLinha($('#g-sis2'), h.t, [{v:h.cpu, cor:'#2f9bd6'}, {v:h.mem, cor:'#2fc4b2'}], [100, s.mem_total]);
}

/* ================= ciclo ================= */
const CARREGAR = {inicio:carregarInicio, docker:carregarDocker, jenkins:carregarJenkins, git:carregarGit, vscode:carregarVscode,
  ansible:carregarAnsible, terraform:carregarTerraform, python:carregarPython, atividades:carregarAtividades, sistema:carregarSistema};
async function carregar(forcar){
  if(ocupado) return;
  if(!forcar && ($('#modal').classList.contains('aberto') || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))) return;
  ocupado = true;
  try{ await CARREGAR[ABA](); $('#atualizado').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR'); }
  catch(e){ $('#atualizado').textContent = 'Erro: ' + e.message; }
  finally{ ocupado = false; }
}
let inicial = 'inicio'; try{ const a = localStorage.getItem('painel-aba'); if(a && CARREGAR[a]) inicial = a; }catch(e){}
irPara(inicial);
setInterval(() => carregar(), 5000);
</script>
