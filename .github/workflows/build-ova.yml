name: Gerar, testar e publicar DevOps-Lab.ova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "*.txt"
      - "ci/release-from-run.txt"
      - ".github/workflows/publicar.yml"
      - "ci/publish-release.sh"
      - ".devcontainer/**"
      - "ci/test-ova-virtualbox.sh"
      - "ci/vm-tests/**"
      - "ci/lab/**"
      - "exemplos/**"
      - ".github/workflows/laboratorio-painel.yml"
      - ".github/workflows/codespaces.yml"
      - "ci/diag-video.sh"
      - ".github/workflows/diag-video.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: build-ova
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker system prune -af || true
          df -h /

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Instalar QEMU e Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer
          packer version
          # Só para diagnóstico: tira fotos da tela da instalação do Ubuntu pelo VNC
          pipx install vncdotool || echo "::warning::vncdotool não instalou; sem fotos da instalação"

      - name: Descobrir a ISO mais recente do Ubuntu 24.04
        id: iso
        run: |
          name=$(curl -fsSL https://releases.ubuntu.com/24.04/SHA256SUMS | grep -oE 'ubuntu-24\.04(\.[0-9]+)*-live-server-amd64\.iso' | head -n 1)
          echo "ISO: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Construir a VM (Packer + QEMU/KVM)
        env:
          PACKER_LOG: "0"
        run: |
          set -o pipefail
          packer init ci/devops-lab-qemu.pkr.hcl
          echo 1 > packer.rc
          : > packer.log
          # Foto da tela da instalação a cada 5 min: se ela travar, dá para ver em que ponto parou
          (
            mkdir -p telas-instalacao
            until grep -q 'Waiting for SSH' packer.log; do sleep 10; grep -qE 'errored|Builds finished' packer.log && exit 0; done
            porta=$(grep -oE 'vnc://127\.0\.0\.1:[0-9]+' packer.log | head -n 1 | sed 's/.*://')
            [ -n "$porta" ] || exit 0
            i=0
            while ! grep -qE 'Connected to SSH|errored|Builds finished' packer.log; do
              sleep 300; i=$((i+1))
              timeout 60 vncdo -s "127.0.0.1::$porta" capture "telas-instalacao/tela-$(printf %02d "$i").png" >/dev/null 2>&1 || true
            done
          ) &
          timeout --signal=INT --kill-after=5m 120m \
            packer build -color=false -var "iso_name=${{ steps.iso.outputs.name }}" ci/devops-lab-qemu.pkr.hcl 2>&1 | tee packer.log
          echo 0 > packer.rc

      - name: Mostrar o erro (anotações)
        if: always()
        run: |
          if [ "$(cat packer.rc 2>/dev/null)" = "0" ]; then exit 0; fi
          touch packer.log
          # As anotações ficam visíveis pela API pública mesmo sem login
          tail -n 150 packer.log | sed 's/\x1b\[[0-9;]*m//g' | split -l 15 - chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=packer-${f}::${msg}"
          done

      - name: Guardar fotos da instalação (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-instalacao
          path: |
            telas-instalacao/
            packer.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Converter para .ova (VirtualBox)
        run: |
          python3 ci/make-ova.py output-qemu/DevOps-Lab.qcow2 output/DevOps-Lab.ova
          rm -rf output-qemu
          cd output && sha256sum DevOps-Lab.ova | tee DevOps-Lab.ova.sha256
          ls -lh

      - name: Publicar o .ova
        uses: actions/upload-artifact@v4
        with:
          name: DevOps-Lab-ova
          path: |
            output/DevOps-Lab.ova
            output/DevOps-Lab.ova.sha256
          compression-level: 0
          retention-days: 30

  test:
    name: Testar no VirtualBox
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o .ova
        uses: actions/download-artifact@v4
        with:
          name: DevOps-Lab-ova
          path: ova

      - name: Instalar VirtualBox 7.2
        run: |
          sudo modprobe -r kvm_intel kvm_amd kvm || true
          wget -qO- https://www.virtualbox.org/download/oracle_vbox_2016.asc | sudo gpg --dearmor -o /usr/share/keyrings/oracle-virtualbox-2016.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian noble contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" build-essential virtualbox-7.2 imagemagick xvfb xdotool
          sudo /sbin/vboxconfig
          VBoxManage --version

      - name: Gerar o .ova final pelo VirtualBox (VMSVGA, USB tablet, área de transferência)
        run: bash ci/finalize-ova-virtualbox.sh ova/DevOps-Lab.ova final

      - name: Guardar o .ova final
        uses: actions/upload-artifact@v4
        with:
          name: DevOps-Lab-ova-final
          path: |
            final/DevOps-Lab.ova
            final/DevOps-Lab.ova.sha256
          compression-level: 0
          retention-days: 30

      - name: Testar a VM
        id: test
        run: |
          set +e
          # Com janela, num X virtual: é como o aluno usa (pega tela preta e mouse)
          Xvfb :99 -screen 0 1600x1000x24 >/dev/null 2>&1 &
          sleep 2
          DISPLAY=:99 VBOX_TIPO=gui bash ci/test-ova-virtualbox.sh final/DevOps-Lab.ova resultados
          echo "fails=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar resultados (branch test-results)
        if: always()
        run: |
          cp -r resultados /tmp/resultados || mkdir -p /tmp/resultados
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan test-results-tmp
          git rm -rfq . || true
          rm -rf ./*
          cp -r /tmp/resultados/. .
          git add -A
          git commit -qm "Resultados do teste no VirtualBox (run ${{ github.run_id }})"
          git push -f origin HEAD:test-results
          if [ -f RESUMO.txt ]; then
            msg=$(grep -E '^\[(OK|FALHA)\]|RESULTADO' RESUMO.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=teste-virtualbox::${msg}"
          fi

      - name: Falhar se o teste falhou
        if: steps.test.outputs.fails != '0'
        run: exit 1

  release:
    name: Publicar Release
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o .ova final (testado)
        uses: actions/download-artifact@v4
        with:
          name: DevOps-Lab-ova-final
          path: ova

      - name: Baixar o .ova compatível (VirtualBox 6.1)
        uses: actions/download-artifact@v4
        with:
          name: DevOps-Lab-ova
          path: compat

      - name: Criar Release pública
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash ci/publish-release.sh "${{ github.sha }}"
