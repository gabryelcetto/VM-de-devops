name: Publicar Release de um build já testado

on:
  push:
    branches: [main]
    paths: ["ci/release-from-run.txt", ".github/workflows/publicar.yml"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: src
        run: echo "run_id=$(tr -d '[:space:]' < ci/release-from-run.txt)" >> "$GITHUB_OUTPUT"
      - name: Baixar o .ova final (testado)
        uses: actions/download-artifact@v4
        with:
          name: DevOps-Lab-UVV-ova-final
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ova

      - name: Baixar o .ova compatível (VirtualBox 6.1)
        uses: actions/download-artifact@v4
        with:
          name: DevOps-Lab-UVV-ova
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: compat

      - name: Criar Release pública
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash ci/publish-release.sh "${{ github.sha }}"
