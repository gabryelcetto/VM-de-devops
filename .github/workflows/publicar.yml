name: Publicar Release de um build já testado

on:
  push:
    branches: [main]
    paths: ["ci/release-from-run.txt", ".github/workflows/publicar.yml"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: src
        run: echo "run_id=$(tr -d '[:space:]' < ci/release-from-run.txt)" >> "$GITHUB_OUTPUT"
      - name: Baixar o .ova
        uses: actions/download-artifact@v4
        with:
          name: DevOps-Lab-UVV-ova
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ova

      - name: Criar Release pública
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          ls -l ova/
          NOTES="VM Ubuntu 24.04 + XFCE com VS Code, Docker, Docker Compose, Git, Ansible, Terraform, Python e Jenkins. Testada automaticamente no VirtualBox. Importar em: VirtualBox > Arquivo > Importar Appliance. Usuario: aluno / Senha: devops"
          fail() { echo "::error title=release::$(tail -c 1500 "$1" | tr '\n' ' ')"; exit 1; }
          gh api -X POST "repos/$REPO/releases" -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
            -f name="DevOps-Lab-UVV ($TAG)" -f body="$NOTES" -f make_latest=true > rel.json 2> rel.err || fail rel.err
          RID=$(python3 -c "import json;print(json.load(open('rel.json'))['id'])")
          for f in DevOps-Lab-UVV.ova DevOps-Lab-UVV.ova.sha256; do
            ok=0
            for try in 1 2 3; do
              code=$(curl -sS -o up.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
                --data-binary "@ova/$f" "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=$f" 2> up.err)
              if [ "$code" = "201" ]; then ok=1; break; fi
              echo "tentativa $try: HTTP $code"; cat up.json up.err >> up.log 2>/dev/null; sleep 20
            done
            [ "$ok" = 1 ] || fail up.log
          done
          echo "::notice title=release::https://github.com/$REPO/releases/download/$TAG/DevOps-Lab-UVV.ova"
